<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Energy Mapping Challenge</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Eczar:wght@400;700&family=Roboto:wght@300;400;500;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">

  <style>
    html, body { margin: 0; height: 100%; font-family: 'Roboto', sans-serif; }
    body { display: flex; flex-direction: column; }
    #map { flex: 1; min-height: 0; width: 100%; }
    .panel {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: 360px;
  max-width: 90vw;
  background: #FFFFFF;
  border-radius: 0;
  border-left: 1px solid rgba(51,55,69,0.14);
  box-shadow: -4px 0 20px rgba(0,0,0,.12);
  padding: 20px;
  z-index: 1000;
  overflow-y: auto;
  font-family: 'Roboto', sans-serif;
}
.panel[hidden] { display: none; }
.panel-close {
  position: absolute; top: 12px; right: 16px;
  border: none; background: #E8F1F2; width: 40px; height: 40px;
  border-radius: 50%; font-size: 18px; cursor: pointer;
}
.panel h2 { font-family: var(--font-heading); margin: 0 24px 14px 0; }
.bar-row { margin-bottom: 14px; }
.bar-label { font-size: 12px; font-weight: 600; color: #5B6372; margin-bottom: 4px; }
.bar-track { background: #E8F1F2; border-radius: 999px; height: 10px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; }
.panel-btn-row { display: flex; gap: 10px; margin-top: 16px; }
.panel-btn {
  flex: 1; padding: 10px; min-height: 44px; border-radius: 999px; border: none; font-weight: 700;
  font-family: 'Roboto', sans-serif; cursor: pointer;
}
.panel-btn.primary { background: #1EAFED; color: white; }
.panel-btn.ghost { background: #E8F1F2; color: #333745; }

.panel-region { font-size: 13px; color: #5B6372; margin: -8px 0 14px; }
.relatable {
  background: #FBD9EA; color: #333745; border-radius: 14px;
  padding: 12px 14px; font-size: 14px; font-weight: 700;
  display: flex; gap: 10px; align-items: center; margin-bottom: 14px;
}
.relatable svg { flex: 0 0 auto; }
.more-box { background: #E8F1F2; border-radius: 14px; padding: 14px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px; }
.unlock-badge { background: #1EAFED; color: white; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding: 4px 10px; border-radius: 999px; align-self: flex-start; }
.more-title { font-weight: 800; font-size: 15px; color: #333745; font-family: var(--font-heading); }
.more-text { font-size: 13px; color: #5B6372; }
.trend-label { font-size: 12px; font-weight: 700; color: #5B6372; text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
.trend { display: flex; align-items: flex-end; gap: 4px; }
.tb { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-end; gap: 2px; }
.tb i { display: block; border-radius: 3px 3px 0 0; }
.tb.sun i, .k-sun { background: #EA168E; }
.tb.wind i, .k-wind { background: #1EAFED; }
.td { font-size: 12px; font-weight: 500; color: #5B6372; text-align: center; white-space: nowrap; }
.trend-key { display: flex; gap: 12px; font-size: 12px; font-weight: 600; color: #5B6372; }
.trend-key span { display: inline-flex; align-items: center; gap: 5px; }
.trend-key i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
.tv { font-size: 12px; font-weight: 600; color: #5B6372; text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
#totalBar {
  flex: 0 0 auto;
  background: linear-gradient(90deg, #0C78AB, #C8127A); /* deeper brand blue and pink, so white text passes the 4.5:1 contrast guideline */
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
  padding: 14px 24px;
  flex-wrap: wrap;
  animation: totalBarIn .6s ease;
}
@keyframes totalBarIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.total-stat { display: flex; align-items: center; gap: 14px; }
.total-icon { flex: 0 0 auto; }
.total-stat-text { display: flex; flex-direction: column; line-height: 1.15; }
.total-number { font-family: var(--font-heading); font-size: 40px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
.total-sub { font-size: 15px; font-weight: 700; opacity: .98; }
.total-badge { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; margin-top: 8px; background: #fff; color: #333745; border-radius: 999px; padding: 5px 14px 5px 6px; font-size: 13px; line-height: 1.2; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.total-badge-icon { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #FBD9EA; font-size: 16px; }
.total-badge strong { color: #C8127A; }
.total-progress { display: flex; flex-direction: column; gap: 4px; min-width: 180px; }
.total-progress-track { width: 100%; height: 8px; background: rgba(255,255,255,.35); border-radius: 999px; overflow: hidden; }
.total-progress-fill { width: 0%; height: 100%; background: #fff; border-radius: 999px; transition: width 1s ease; }
.total-progress-label { font-size: 11px; font-weight: 700; }

.pin-circle {
  width: 32px; height: 32px; border-radius: 50%;
  background: #EA168E; border: 3px solid white;
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
  display: flex; align-items: center; justify-content: center;
  transition: background .15s ease;
}
.school-pin:hover .pin-circle,
.school-pin.active .pin-circle { background: #1EAFED; }
.reading-grid { display: flex; gap: 12px; margin-bottom: 14px; }
.reading-card {
  flex: 1; background: #E8F1F2; border-radius: 14px; padding: 14px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.reading-label { font-size: 12px; font-weight: 700; color: #5B6372; text-transform: uppercase; letter-spacing: .04em; }
.reading-pct { font-size: 18px; font-weight: 800; color: #333745; }
.dial { width: 100%; max-width: 150px; height: auto; }
.dial-end { font: 600 12px 'Roboto', sans-serif; fill: #5B6372; }
#hint {
  position: fixed; top: 78px; left: 50%; transform: translateX(-50%);
  background: #FFFFFF; border: 1px solid rgba(51,55,69,0.14);
  box-shadow: 0 4px 14px rgba(0,0,0,.12); padding: 8px 16px;
  border-radius: 999px; font-weight: 700; font-size: 13px;
  color: #333745; z-index: 500; pointer-events: none;
}
header {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px;
  padding: 14px 20px;
  background: #FFFFFF;
  border-bottom: 1px solid rgba(51,55,69,0.14);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand h1 { font-family: var(--font-heading); font-size: 22px; font-weight: 700; margin: 0; color: #333745; line-height: 1.2; }
.brand-subtitle { font-size: 12.5px; font-weight: 500; color: #5B6372; margin: 2px 0 0; }
.brand-logo { height: 53px; width: auto; flex: 0 0 auto; margin: -4.5px 0; } /* 20% bigger, but the negative margin keeps the white bar at its original height */
.compare-btn {
  background: #E8F1F2; color: #333745; border: none; border-radius: 999px;
  padding: 10px 18px; font-weight: 700; font-family: 'Roboto', sans-serif;
  font-size: 14px; cursor: pointer;
}
  .school-pin.no-data .pin-circle { background: #9AA3B2; }
.school-pin.no-data:hover .pin-circle, .school-pin.no-data.active .pin-circle { background: #1EAFED; }
.status-dark { color: #5B6372; font-weight: 600; }
.panel-btn:disabled { opacity: .5; cursor: not-allowed; }
/* Log a reading form */
.lf-back { border: 0; background: none; color: #1EAFED; font: 700 14px 'Roboto', sans-serif; cursor: pointer; padding: 0; margin: 0 0 10px; }
.log-form { display: grid; gap: 16px; }
.log-form fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 0; }
.log-form legend, .lf-label { font-weight: 800; font-size: 15px; color: #333745; padding: 0; }
.lf-field { display: grid; gap: 6px; }
.lf-hint { font-size: 13px; color: #5B6372; margin: 0; font-weight: 400; }
.lf-type { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lf-type input, .lf-weather input { position: absolute; opacity: 0; pointer-events: none; }
.lf-type label { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 10px 8px; border: 2px solid #D9DEE6; border-radius: 14px; background: #fff; cursor: pointer; font-family: var(--font-heading); font-weight: 700; font-size: 17px; }
#t-solar:checked + label { border-color: #EA168E; background: #FBD9EA; }
#t-wind:checked + label { border-color: #1EAFED; background: #D3EFFB; }
.lf-type input:focus-visible + label, .lf-weather input:focus-visible + label { outline: 3px solid #333745; outline-offset: 2px; }
.lf-reading-row { display: flex; border: 2px solid #D9DEE6; border-radius: 14px; overflow: hidden; background: #fff; }
.lf-reading-row:focus-within { border-color: #1EAFED; }
.lf-reading-row input { flex: 1; min-width: 0; border: 0; padding: 10px 12px; font: 800 24px 'Roboto', sans-serif; background: transparent; }
.lf-reading-row input:focus { outline: none; }
.lf-unit { display: flex; align-items: center; padding: 0 14px; background: #E8F1F2; font-weight: 800; color: #5B6372; }
.lf-preview { border-radius: 14px; padding: 12px 14px; background: #E8F1F2; display: grid; gap: 3px; min-height: 76px; }
.lf-preview.solar { background: #FBD9EA; }
.lf-preview.wind { background: #D3EFFB; }
.lf-big { font-family: var(--font-heading); font-size: 22px; font-weight: 700; color: #333745; }
.lf-equiv { font-size: 14px; color: #333745; }
.lf-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lf-two label { display: grid; gap: 6px; min-width: 0; }
.lf-two input, .lf-text { padding: 10px 12px; border: 2px solid #D9DEE6; border-radius: 12px; font: 16px 'Roboto', sans-serif; background: #fff; width: 100%; min-width: 0; box-sizing: border-box; }
.lf-weather { display: flex; flex-wrap: wrap; gap: 8px; }
.lf-weather label { padding: 10px 14px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; border: 2px solid #D9DEE6; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 14px; background: #fff; }
.lf-weather input:checked + label { border-color: #1EAFED; background: #D3EFFB; }
.lf-switch { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: #5B6372; cursor: pointer; }
.lf-switch input { width: 18px; height: 18px; margin-top: 1px; accent-color: #1EAFED; }
.lf-submit { width: 100%; min-height: 52px; font-size: 16px; flex: none; }
.lf-error { color: #B3261E; font-weight: 700; font-size: 14px; margin: 0; }
.lf-warn { color: #8A5A00; background: #FFF3D6; border-radius: 10px; padding: 8px 10px; font-weight: 700; font-size: 14px; margin: 0; }
.lf-msg { border-radius: 14px; padding: 12px 14px; font-weight: 700; display: grid; gap: 4px; }
.lf-msg p { font-weight: 500; color: #333745; margin: 0; }
.lf-msg.ok { background: #D3EFFB; color: #0C5C85; }
.lf-msg.err { background: #FBE5E3; color: #B3261E; }
.lf-msg.note { background: #FFF3D6; color: #8A5A00; }

:root { --font-heading: 'Eczar', 'Eczar Local', 'Source Serif 4', Georgia, serif; }
.total-co2 { display: flex; flex-direction: column; gap: 3px; font-size: 12px; line-height: 1.2; border-left: 1px solid rgba(255,255,255,.5); padding-left: 22px; width: min(310px, 100%); }
.co2-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
.co2-title { font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.co2-info { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid #fff; background: transparent; color: #fff; font: 800 14px 'Roboto', sans-serif; line-height: 1; padding: 0; cursor: pointer; }
.co2-big { font-family: var(--font-heading); font-weight: 700; font-size: 22px; line-height: 1.15; }
.co2-sub { font-size: 13px; font-weight: 400; line-height: 1.3; }
.co2-car { font-size: 13px; font-weight: 700; line-height: 1.3; margin-top: 2px; }
.co2-label { font-weight: 700; white-space: nowrap; }
.co2-num { font-family: var(--font-heading); font-weight: 700; font-size: 16px; text-align: right; white-space: nowrap; }
.school-cluster .pin-circle { width: 40px; height: 40px; box-sizing: border-box; color: #fff; font: 700 15px 'Roboto', sans-serif; }
.info-dot { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; margin-left: 8px; vertical-align: middle; border-radius: 50%; border: 1.5px solid #fff; background: transparent; color: #fff; font: 700 13px 'Roboto', sans-serif; line-height: 1; padding: 0; cursor: pointer; }
.link-btn { align-self: flex-start; border: 0; background: none; padding: 4px 0; min-height: 32px; color: #0C78AB; font: 700 13px 'Roboto', sans-serif; text-decoration: underline; cursor: pointer; }
.compare-btn { min-height: 44px; }
.compare-btn:not(.log-header-btn):not(.on) { background: #fff; color: #333745; box-shadow: inset 0 0 0 2px #1EAFED; }
.compare-btn.on { background: #333745; color: #fff; }
.header-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.find-wrap { position: relative; z-index: 1500; }
.find-input { min-height: 44px; width: 210px; max-width: 100%; box-sizing: border-box; border: 1.5px solid #D3EFFB; border-radius: 999px; padding: 10px 16px; font: 500 14px 'Roboto', sans-serif; color: #333745; background: #fff; }
.find-input:focus { outline: 2px solid #1EAFED; outline-offset: 1px; }
.find-list { position: absolute; top: calc(100% + 6px); left: 0; width: 280px; max-width: 90vw; margin: 0; padding: 6px; list-style: none; background: #fff; border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.2); border: 1px solid rgba(51,55,69,0.14); }
.find-list[hidden] { display: none; }
.find-list button { display: block; width: 100%; text-align: left; border: 0; background: none; border-radius: 10px; padding: 9px 12px; font: 600 14px 'Roboto', sans-serif; color: #333745; cursor: pointer; }
.find-list button:hover, .find-list button:focus { background: #D3EFFB; outline: none; }
.find-note { display: block; font-size: 12px; font-weight: 500; color: #5B6372; }
.find-empty { padding: 10px 12px; font-size: 13px; color: #5B6372; }
.log-header-btn { background: #1EAFED; color: #fff; }
.compare-bar { position: fixed; top: 96px; left: 50%; transform: translateX(-50%); z-index: 1100; background: #333745; color: #fff; border-radius: 999px; padding: 10px 12px 10px 20px; display: flex; align-items: center; gap: 14px; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 92vw; }
.compare-bar[hidden] { display: none; }
.compare-cancel { border: 0; border-radius: 999px; background: #fff; color: #333745; font: 700 14px 'Roboto', sans-serif; padding: 10px 16px; min-height: 44px; cursor: pointer; }
.modal { position: fixed; inset: 0; z-index: 2000; background: rgba(51,55,69,.5); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal[hidden] { display: none; }
.modal-card { position: relative; background: #fff; border-radius: 20px; width: min(940px, 100%); max-height: 92vh; overflow: auto; padding: 24px 24px 28px; box-shadow: 0 20px 60px rgba(0,0,0,.3); font-family: 'Roboto', sans-serif; color: #333745; }
.modal-card h2 { font-family: var(--font-heading); margin: 0 36px 6px 0; font-size: 24px; }
.modal-card h3 { font-family: var(--font-heading); font-size: 17px; margin: 20px 0 6px; }
.m-text { color: #5B6372; margin: 0 0 12px; font-size: 14px; }
.m-sub { color: #5B6372; font-size: 12px; font-weight: 500; }
.m-list { margin: 0 0 12px; padding-left: 20px; font-size: 14px; }
.m-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
.m-actions .panel-btn { flex: 0 0 auto; padding: 10px 18px; }
.data-chart { width: 100%; height: 280px; }
.data-table-wrap { overflow: auto; max-height: 320px; border: 1px solid #E1E6EE; border-radius: 12px; margin-top: 12px; }
table.data, table.cmp { border-collapse: collapse; width: 100%; font-size: 14px; }
table.data th, table.data td, table.cmp th, table.cmp td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #EEF1F5; }
table.data th, table.cmp thead th { position: sticky; top: 0; background: #E8F1F2; font-weight: 800; }
table.data td, table.data th { white-space: nowrap; }
table.data td.n, table.data th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.cmp thead th { font-family: var(--font-heading); font-size: 16px; }
table.cmp td.k { color: #5B6372; font-weight: 700; width: 28%; }
table.cmp td.span { text-align: center; }
.cmp-val { display: inline-flex; align-items: center; gap: 8px; }
.cmp-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
select.lf-text { appearance: auto; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
@media (max-width: 560px) { .total-co2 { border-left: 0; padding-left: 0; } .total-number { font-size: 32px; } .compare-bar { top: 130px; } }

/* ------------------------------------------------------------------
   Text styles (one place to change them)
   1. Headings: Eczar Bold
   2. Text: Roboto (labels, buttons, numbers and anything to act on)
   3. Light text: Roboto Light (the quieter, explaining sentences)
------------------------------------------------------------------- */
body { font-weight: 400; }
.brand h1, .panel h2, .modal-card h2, .modal-card h3, .more-title, .total-number, .lf-big, .co2-num, table.cmp thead th {
  font-family: var(--font-heading); font-weight: 700;
}
.lf-type label { font-family: 'Roboto', sans-serif; font-weight: 700; }
.brand-subtitle, .panel-region, .more-text, .lf-hint, .lf-switch, .m-text, .m-sub, .m-list, .find-note, .find-empty, .td, .lf-msg p {
  font-family: 'Roboto', sans-serif; font-weight: 300; color: #4B5262;
}
/* The find box sits under the side panel and the log form, so it hides while they are open */
body.panel-open .find-wrap { visibility: hidden; }

/* Compare bars and keyboard focus */
.cmp-bar { height: 8px; width: 100%; max-width: 220px; background: #E8F1F2; border-radius: 999px; overflow: hidden; margin-top: 6px; }
.cmp-bar i { display: block; height: 100%; border-radius: 999px; }
.cmp-lead { font-weight: 700; }
table.cmp td { vertical-align: top; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid #1EAFED; outline-offset: 2px; }
#totalBar button:focus-visible { outline-color: #fff; }
</style>

  <script>
const map = L.map('map');

L.tileLayer('https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png?key=cb1_4f1n_1_78afe8bcf5a4043ff6ac084b', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  maxZoom: 19
}).addTo(map);

/* ------------------------------------------------------------------
   Settings. Everything the map needs to know lives here.
------------------------------------------------------------------- */
// The Google Sheet script that holds the schools and readings.
const API_URL = 'https://script.google.com/macros/s/AKfycbwEGWzVVU6ySlKbe2to-H8_tQkYATB-vHoSsFi62l_ndXTNONfPmJ9Upe3n4UlPbC0/exec';

// Dial ranges, as set by Beth: the sun dial runs from 0 to 1200 lux and the wind dial from 0 to 12 m/s.
const SOLAR_MAX_LUX = 1200;
const WIND_MAX_MS = 12;

// Energy formulas, as set by Beth (Nov 2026). Both give kWh per day.
// Solar: (lux x 0.0079 W/m2 per lux) x 25 m2 of panels x 20% efficiency x 7.64 hours of sun / 1000
// Wind:  (speed^3 x 1.225 kg/m3 air / 2) x 962 m2 rotor x 30% efficiency x 4 hours at this speed / 1000
//        (a mid-size turbine in the pupils' town, not in the school yard). The / 1000 turns watt-hours into kWh.
const WATTS_PER_LUX = 0.0079, PANEL_M2 = 25, PANEL_EFF = 0.2, SUN_HOURS = 7.64;
const SOLAR_KWH_PER_LUX = (WATTS_PER_LUX * PANEL_M2 * PANEL_EFF * SUN_HOURS) / 1000;
function luxTokWh(lux) { return lux * SOLAR_KWH_PER_LUX; }
const AIR_DENSITY = 1.225, ROTOR_M2 = 962, WIND_EFF = 0.3, WIND_HOURS = 4;
const WIND_CUT_IN = 3; // m/s. A real turbine does not turn below about 3 to 4 m/s, so it makes no energy.
// Readings above 12 m/s are counted as 12 m/s, because the wind meter cannot read higher (a bigger number is usually a missing decimal point).
function windTokWh(ms) {
  if (!(ms >= WIND_CUT_IN)) return 0;
  const v = Math.min(ms, WIND_MAX_MS);
  return (((v * v * v) * AIR_DENSITY / 2) * ROTOR_M2 * WIND_EFF * WIND_HOURS) / 1000;
}
function readingTokWh(type, v) { const k = type === 'solar' ? luxTokWh(v) : windTokWh(v); return Math.round(k * 10000) / 10000; }

// Carbon figures, in kg per kWh of electricity.
// grid = the UK's average electricity in 2024, 124 g of CO2 (Carbon Brief, using DESNZ and NESO data). Generation only, not whole-life.
// gas, sun and wind = median whole-life CO2e (IPCC 2014, Working Group III, Annex III). Gas in a combined-cycle plant is 490 g.
// Coal is not used: the UK's last coal power station closed on 30 September 2024.
const CO2_KG_PER_KWH = { grid: 0.124, gas: 0.49, sun: 0.041, wind: 0.011 }; // sun = rooftop solar panels, wind = onshore wind (same IPCC table)

/* ------------------------------------------------------------------
   Helpers
------------------------------------------------------------------- */
const $ = id => document.getElementById(id);
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function fmt(n) {
  if (n === null || n === undefined || isNaN(n)) return '–';
  const dp = n > 0 && n < 0.1 ? 3 : n < 10 ? 2 : n < 100 ? 1 : 0;
  return Number(n).toLocaleString('en-GB', { maximumFractionDigits: dp });
}
function fmtDate(iso) {
  const d = new Date(iso + 'T12:00:00');
  return isNaN(d) ? iso : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}
function api(params) {
  return fetch(API_URL + '?' + new URLSearchParams(params).toString())
    .then(r => r.json())
    .then(d => { if (!d.ok) throw new Error(d.error || 'api_error'); return d; });
}

let allSchools = [];     // every school that is switched on in the Sheet (used by the Log a reading picker)
let schools = [];        // schools with at least one reading. Only these get a pin
let MILESTONES = [];     // every milestone, smallest first (from the Milestones tab)
const details = {};      // school id -> full detail

/* The Sheet script still works out kWh with the old formulas. So the map recalculates every reading
   from its raw meter number, then re-adds the running totals and milestones. */
function setMilestonesFrom(ms) {
  if (MILESTONES.length || !ms) return;
  const all = [].concat(ms.unlocked || [], ms.upcoming || [], ms.next ? [ms.next] : []);
  const seen = {};
  MILESTONES = all.filter(m => { const k = m.kwh + '|' + m.milestone; if (seen[k]) return false; seen[k] = 1; return true; })
    .map(m => ({ icon: m.icon, milestone: m.milestone, kwh: m.kwh })).sort((a, b) => a.kwh - b.kwh);
}
function milestonesFor(total) {
  const unlocked = MILESTONES.filter(m => m.kwh <= total);
  const upcoming = MILESTONES.filter(m => m.kwh > total);
  const n = upcoming[0];
  return { unlocked, upcoming, next: n ? Object.assign({}, n, { kwhToGo: n.kwh - total }) : null };
}
function normalizeDetail(d) {
  const rs = d.readings.map(r => Object.assign({}, r, { kwh: r.reading >= 0 ? readingTokWh(r.type, Number(r.reading)) : r.kwh }));
  const key = r => r.date + ' ' + (String(r.time || '').length < 5 ? '0' : '') + (r.time || '');
  rs.sort((a, b) => key(a).localeCompare(key(b)));
  // One value per school, kind (sun or wind) and day: several readings on the same day count as their average,
  // so logging more often does not add more energy.
  const acc = {}; let sol = 0, win = 0;
  rs.forEach(r => {
    const k = r.type + '|' + r.date;
    const e = acc[k] || (acc[k] = { sum: 0, n: 0, mean: 0 });
    e.sum += r.kwh; e.n++;
    const m = e.sum / e.n, delta = m - e.mean; e.mean = m;
    if (r.type === 'solar') sol += delta; else win += delta;
    r.runningSolar = sol; r.runningWind = win; r.runningTotal = sol + win;
  });
  const days = new Set(rs.map(r => r.date)).size;
  d.readings = rs;
  d.totals = { count: rs.length, days, solar: sol, wind: win, total: sol + win };
  d.milestones = milestonesFor(sol + win);
  return d;
}
function loadDetail(id) {
  return api({ action: 'school', schoolId: id }).then(raw => {
    setMilestonesFrom(raw.milestones);
    const d = normalizeDetail(raw);
    details[id] = d;
    const s = allSchools.find(x => x.id === id);
    if (s) { s.totals = d.totals; s.readings = d.totals.count; }
    return d;
  });
}

/* An everyday comparison for an amount of energy. */
function comparison(kwh) {
  if (!(kwh > 0) || !MILESTONES.length) return '';
  let best = null;
  MILESTONES.forEach(m => {
    const times = kwh / m.kwh;
    if (times >= 1 && times <= 60 && (!best || m.kwh > best.m.kwh)) best = { m, times };
  });
  if (!best) {
    if (kwh < MILESTONES[0].kwh) return 'A little bit of energy. Keep measuring!';
    const last = MILESTONES[MILESTONES.length - 1];
    best = { m: last, times: kwh / last.kwh };
  }
  const n = Math.floor(best.times);
  const what = best.m.milestone.charAt(0).toLowerCase() + best.m.milestone.slice(1);
  return `${best.m.icon} That's enough to ${what}${n === 1 ? '.' : ' ' + n + ' times.'}`;
}

/* ------------------------------------------------------------------
   Total bar across the top of the map
------------------------------------------------------------------- */
const totalBar = $('totalBar');

let shownTotal = 0; // the number currently on screen, so the count-up starts from there
let countTimer = null;
function countUp(el, from, to) {
  if (countTimer) clearInterval(countTimer);
  const reduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || from === to) { el.textContent = fmt(to) + ' kWh'; shownTotal = to; return; }
  const start = Date.now(), ms = 1600;
  el.textContent = fmt(from) + ' kWh';
  countTimer = setInterval(() => {
    const p = Math.min(1, (Date.now() - start) / ms), eased = 1 - Math.pow(1 - p, 3);
    shownTotal = from + (to - from) * eased;
    el.textContent = fmt(shownTotal) + ' kWh';
    if (p >= 1) { clearInterval(countTimer); countTimer = null; shownTotal = to; el.textContent = fmt(to) + ' kWh'; }
  }, 30);
}

function renderTotalBar() {

/* A half-circle dial with a needle. The scale runs from 0 to max and the number sits underneath. */
function dial(label, icon, reading, max, unit, color) {
  const cx = 70, cy = 66, r = 52, has = reading != null;
  const p = has ? Math.max(0, Math.min(1, reading / max)) : 0;
  const pt = (q, rad) => { const th = Math.PI * (1 - q); return [(cx + rad * Math.cos(th)).toFixed(1), (cy - rad * Math.sin(th)).toFixed(1)]; };
  const [lx, ly] = pt(0, r), [rx, ry] = pt(1, r), [vx, vy] = pt(p, r), [nx, ny] = pt(p, r - 10);
  // The track always shows the full scale: pink at the low end, blue at the high end. The needle shows today's reading.
  const gid = 'dialgrad-' + String(label).toLowerCase().replace(/[^a-z]/g, '');
  const defs = `<defs><linearGradient id="${gid}" gradientUnits="userSpaceOnUse" x1="${lx}" y1="0" x2="${rx}" y2="0"><stop offset="0" stop-color="#EA168E"/><stop offset="1" stop-color="#1EAFED"/></linearGradient></defs>`;
  const track = `<path d="M ${lx} ${ly} A ${r} ${r} 0 0 1 ${rx} ${ry}" fill="none" stroke="url(#${gid})" stroke-width="11" stroke-linecap="round"${has ? '' : ' opacity="0.35"'}/>`;
  const value = has ? `<circle cx="${vx}" cy="${vy}" r="7" fill="#fff" stroke="#333745" stroke-width="2.5"/>` : '';
  const needle = has ? `<line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="#333745" stroke-width="3.5" stroke-linecap="round"/>` : '';
  return `
  <div class="reading-card">
    <div class="reading-label">${label}</div>
    ${icon}
    <svg class="dial" viewBox="0 0 140 86" role="img" aria-label="${esc(label)} dial: ${has ? esc(fmt(reading)) + ' ' + unit : 'no reading yet'}, on a scale from 0 to ${max}">
      ${defs}${track}${value}${needle}<circle cx="${cx}" cy="${cy}" r="6" fill="#333745"/>
      <text x="${lx}" y="82" text-anchor="middle" class="dial-end">0</text>
      <text x="${rx}" y="82" text-anchor="middle" class="dial-end">${max}</text>
    </svg>
    <div class="reading-pct">${has ? esc(fmt(reading)) + ' ' + unit : 'No reading yet'}</div>
  </div>`;
}

function renderPanel(school, d) {
  const readings = d.readings;

  const unlocked = d.milestones.unlocked;

  // One bar per reading (the last 7): how much energy that reading added. Pink = sun, blue = wind.
  const recent = readings.slice(-7);
  const maxKwh = Math.max(...recent.map(r => r.kwh)) || 1;
  const shortDate = iso => { const d = new Date(iso + 'T12:00:00'); return isNaN(d) ? iso : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
  const trendBars = recent.map(r =>

  ).join('');

  panelBody.innerHTML = `
    <h2>${esc(school.name)}</h2>

    <div class="reading-grid">
      ${dial('Solar', SUN_ICON, lastSolar ? lastSolar.reading : null, SOLAR_MAX_LUX, 'lux', '#EA168E')}
      ${dial('Wind', WIND_ICON, lastWind ? lastWind.reading : null, WIND_MAX_MS, 'm/s', '#1EAFED')}
    </div>
    <div class="relatable">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#1EAFED" d="M13 2 4 14h6l-1 8 10-13h-6z"/></svg>
      <span>${esc(comparison(t.total))}</span>
    </div>
    <div class="more-box" id="moreBox">
      ${lastUnlocked ? '<span class="unlock-badge">Milestone unlocked</span>' : ''}
      <div class="more-title">${fmt(t.total)} kWh we could make so far</div>
      <div class="more-text">${t.count} reading${t.count === 1 ? '' : 's'} on ${t.days} day${t.days === 1 ? '' : 's'}: ${fmt(t.solar)} kWh from the sun and ${fmt(t.wind)} kWh from the wind.${lastUnlocked ? ' Latest milestone: ' + esc(lastUnlocked.icon + ' ' + lastUnlocked.milestone) + '.' : ''}</div>
      <button class="link-btn" id="energyInfoPanel" type="button">How is this worked out?</button>
      <div class="trend-label">Energy from each reading (kWh)</div>
      <div class="trend-key"><span><i class="k-sun"></i>Sun</span><span><i class="k-wind"></i>Wind</span></div>
      <div class="trend">${trendBars}</div>

        <button class="panel-btn ghost" id="dataBtn" type="button">My school's data</button>
    </div>
  `;
  wireLogBtn(school);
  const ep = $('energyInfoPanel'); if (ep) ep.addEventListener('click', openEnergyInfo);

let openToken = 0;
function openPanel(school) {
  const token = ++openToken;
  panelBody.innerHTML = `<h2>${esc(school.name)}</h2><p class="status-dark">Loading this school's energy…</p>`;

      panelBody.innerHTML = `<h2>${esc(school.name)}</h2><p class="status-dark">We couldn't load this school's readings. Please try again in a minute.</p>`;

function addMarker(school) {
  if (markers[school.id]) { markers[school.id].setIcon(pinIcon(true)); return; }

function addMarkers() {

// The map works out every kWh itself from the raw meter readings, using Beth's formulas above.
const LIMITS = { solar: { min: 0, max: 150000 }, wind: { min: 0, max: 40 } };
const WIND_WARN = 8; // m/s. Above this we gently ask the child to check for a missing decimal point.
const TYPE_TEXT = {
  solar: { label: 'Light level', hint: 'Read the number on the light meter, pointing it at the sky. It reads from 0 to 1200.', unit: 'lux' },
  wind:  { label: 'Wind speed',  hint: 'Hold the wind meter up high and wait for the number to settle. It reads from 0 to 12.', unit: 'm/s' }
};
// The team can practise safely by adding ?test=1 to the page address. Then a Test mode box appears, ticked, and nothing is saved.
const TEST_PAGE = typeof location !== 'undefined' && /[?&]test=1\b/.test(location.search || '');
const WEATHER_IDS = ['w-sunny', 'w-partly', 'w-cloudy', 'w-rainy'];
const ERROR_TEXT = {
  bad_key: ["That school code didn't work.", 'Please check it with your teacher and try again.'],
  not_set_up: ["The energy map isn't set up yet.", 'Please ask your teacher to tell Sustain Ed.'],
  unknown_school: ["We don't recognise this school.", 'Please ask your teacher to tell Sustain Ed.'],
  bad_type: ['Choose Sun or Wind first.', ''],
  bad_reading: ['That reading needs to be a number.', 'Type just the number from the meter, like 850.'],
  out_of_range: ['That number looks too big.', 'Check the meter again and type the number you see.'],
  bad_date: ['Check the date.', 'Pick the day you took the reading.'],
  future_date: ['That date is in the future.', 'Pick today or a day before today.'],
  bad_time: ['Check the time.', 'Pick the time you took the reading.'],
  bad_weather: ['Pick one of the weather choices.', ''],
  duplicate: ["You've already added this reading.", "It's on your chart already, so you don't need to add it again."],
  server_error: ['Something went wrong on our side.', 'Wait a minute, then try again.'],
  network: ["We couldn't reach the energy map.", 'Check the internet connection, then try again.']
};

function pad(n) { return (n < 10 ? '0' : '') + n; }
function todayLocal() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function nowTime() { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function getSavedCode() { try { return localStorage.getItem('emc-school-code') || ''; } catch (e) { return ''; } }
function saveCode(v) { try { localStorage.setItem('emc-school-code', v); } catch (e) { /* private browsing: fine */ } }
function apiPost(body) {
  // text/plain keeps the browser from sending a CORS preflight, which Apps Script doesn't answer.
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(r => r.json());
}

function wireLogBtn(school) {
  const b = $('logBtn');
  if (b) b.addEventListener('click', () => openForm(school));
  const d = $('dataBtn');
  if (d) d.addEventListener('click', () => onDataClick(school));
}

function openForm(school) {
  openToken++; // cancels any school details still loading
  panelBody.innerHTML = formHTML(school);
  panel.hidden = false;
  hint.style.display = 'none';
  $('lf-date').value = todayLocal(); $('lf-date').max = todayLocal(); $('lf-time').value = nowTime();
  $('lf-code').value = getSavedCode();

  const cur = () => ($('t-wind').checked ? 'wind' : 'solar');
  const weather = () => { const id = WEATHER_IDS.find(i => $(i).checked); return id ? $(id).value : ''; };
  const testMode = () => $('lf-test').checked;
  function showMsg(kind, title, body) {
    $('lf-msg').innerHTML = '<div class="lf-msg ' + kind + '"><span>' + esc(title) + '</span>' + (body ? '<p>' + esc(body) + '</p>' : '') + '</div>';
  }
  function parse() {
    const raw = $('lf-reading').value.trim().replace(',', '.');
    if (raw === '') return { empty: true };
    if (!/^\d*\.?\d+$/.test(raw)) return { error: ERROR_TEXT.bad_reading };
    const v = Number(raw), lim = LIMITS[cur()];
    if (v < lim.min || v > lim.max) return { error: ERROR_TEXT.out_of_range };
    return { value: v };
  }
  function update() {
    const t = cur(), txt = TYPE_TEXT[t], p = parse();
    $('lf-label').textContent = txt.label; $('lf-hint').textContent = txt.hint; $('lf-unit').textContent = txt.unit;
    const prev = $('lf-preview'), err = $('lf-error'), warn = $('lf-warn');
    prev.className = 'lf-preview ' + t;
    err.hidden = true; warn.hidden = true;
    if (p.empty || p.error) {
      prev.innerHTML = '<span class="lf-hint">Type a reading to see how much energy that is.</span>';
      if (p.error) { err.textContent = p.error[0] + ' ' + p.error[1]; err.hidden = false; }
      return;
    }
    if (t === 'wind' && p.value > WIND_MAX_MS) {
      warn.textContent = "That's higher than the wind meter reads (12 m/s). Please check the meter. Did you leave out a decimal point? If it is right, we will count it as 12 m/s.";
      warn.hidden = false;
    } else if (t === 'wind' && p.value > WIND_WARN) {
      warn.textContent = "That's a very strong wind. Please check the meter. Did you leave out a decimal point?";
      warn.hidden = false;
    } else if (t === 'solar' && p.value > SOLAR_MAX_LUX) {
      warn.textContent = "That's higher than the light meter reads (1200 lux). Please check the meter.";
      warn.hidden = false;
    }
    const kwh = readingTokWh(t, p.value);
    const intro = t === 'wind' ? 'On a day like this, a wind turbine in your town could make' : 'On a day like this, 25 m² of solar panels could make';
    prev.innerHTML = '<span class="lf-hint">' + intro + '</span>' +
      '<span class="lf-big">' + fmt(kwh) + ' kWh</span><span class="lf-equiv">' + esc(t === 'wind' && p.value < WIND_CUT_IN ? 'A wind turbine needs about ' + WIND_CUT_IN + ' m/s of wind to start turning.' : comparison(kwh)) + '</span>';
  }
  function checkWhen() {
    const d = $('lf-date').value, t = $('lf-time').value, e = $('lf-when-error');
    e.hidden = true;
    if (!d) { e.textContent = 'Pick the day you took the reading.'; e.hidden = false; return false; }
    if (d > todayLocal()) { e.textContent = ERROR_TEXT.future_date.join(' '); e.hidden = false; return false; }
    if (!t) { e.textContent = 'Pick the time you took the reading.'; e.hidden = false; return false; }
    return true;
  }
  function syncMode() { $('lf-submit').textContent = testMode() ? 'Check my reading' : 'Save my reading'; }

  // After a real save: reload this school, the totals bar and the pin so everything is up to date.
  function refreshAfterSave() {
    return loadDetail(school.id).then(() => {
      if (!schools.includes(school)) schools.push(school); // a school's first reading gives it a pin
      addMarker(school);
      renderTotalBar();
      const mk = markers[school.id];
      if (mk && mk.getElement()) mk.getElement().classList.add('active');
    });
  }

  function onSubmit(ev) {
    ev.preventDefault();
    $('lf-msg').innerHTML = '';
    const p = parse();
    if (p.empty) { $('lf-error').textContent = 'Type the number from the meter first.'; $('lf-error').hidden = false; $('lf-reading').focus(); return; }
    if (p.error) { $('lf-reading').focus(); return; }
    if (!checkWhen()) return;
    const code = $('lf-code').value.trim();
    if (!code) { showMsg('note', 'Add your school code first.', 'Please ask your teacher if you are not sure what it is.'); $('lf-code').focus(); return; }
    saveCode(code);

    const dry = testMode();
    const typeNow = cur(), added = readingTokWh(typeNow, p.value);
    const before = details[school.id] ? details[school.id].totals.total : school.totals.total;
    const btn = $('lf-submit');
    btn.disabled = true; btn.textContent = dry ? 'Checking…' : 'Saving…';

    apiPost({
      key: code, schoolId: school.id, type: typeNow, reading: p.value,
      date: $('lf-date').value, time: $('lf-time').value, weather: weather(), dryRun: dry
    }).then(res => {
      if (!res.ok) {
        const t = ERROR_TEXT[res.error] || ERROR_TEXT.server_error;
        showMsg(res.error === 'duplicate' ? 'note' : 'err', t[0], t[1]);
        return;
      }
      const after = before + added;
      const newly = MILESTONES.filter(m => m.kwh > before && m.kwh <= after);
      if (dry) {
        showMsg('note', "Looks good! Test mode is on, so this wasn't saved.",
          'Saving it would add ' + fmt(added) + ' kWh, taking ' + school.name + ' to ' + fmt(after) + ' kWh' +
          (newly.length ? ' and unlocking: ' + newly.map(m => m.milestone).join(', ') + '.' : '.'));
        return;
      }
      showMsg('ok', 'Saved! You added ' + fmt(added) + ' kWh.',
        newly.length ? 'New milestone unlocked: ' + newly.map(m => m.icon + ' ' + m.milestone).join(', ') + '!' : comparison(added));
      $('lf-reading').value = ''; update();
      return refreshAfterSave();
    }).catch(() => {
      const t = ERROR_TEXT.network; showMsg('err', t[0], t[1]);
    }).then(() => { btn.disabled = false; syncMode(); });
  }

  $('formBack').addEventListener('click', () => openPanel(school));
  ['t-solar', 't-wind'].forEach(id => $(id).addEventListener('change', update));
  $('lf-reading').addEventListener('input', update);
  $('lf-date').addEventListener('change', checkWhen);
  $('lf-time').addEventListener('change', checkWhen);
  $('lf-test').addEventListener('change', syncMode);
  $('logForm').addEventListener('submit', onSubmit);
  update(); syncMode();
}

/* ------------------------------------------------------------------
   Shared helpers for the data view, the compare view and the notes
------------------------------------------------------------------- */
function getDetail(school) {
  return details[school.id] ? Promise.resolve(details[school.id]) : loadDetail(school.id);
}
function padTime(t) {
  const m = /^(\d{1,2}):(\d{2})/.exec(t || '');
  return m ? (m[1].length < 2 ? '0' : '') + m[1] + ':' + m[2] : (t || '');
}
function toTs(date, time) {
  const [y, mo, d] = String(date).split('-').map(Number);
  const [h, mi] = padTime(time).split(':').map(Number);
  return new Date(y, (mo || 1) - 1, d || 1, h || 0, mi || 0).getTime();
}
function hexA(hex, a) {
  const n = parseInt(hex.replace('#', ''), 16);
  return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
}
function clearActiveMarkers() {
  Object.values(markers).forEach(m => { const e = m.getElement(); if (e) e.classList.remove('active'); });
}

/* Charts use Plotly, loaded only when a chart is first needed. */
let plotlyPromise = null;
function loadPlotly() {
  if (typeof Plotly !== 'undefined') return Promise.resolve();
  if (!plotlyPromise) {
    plotlyPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/plotly.js-basic-dist-min@2.35.2/plotly-basic.min.js';
      s.onload = resolve; s.onerror = () => reject(new Error('plotly'));
      document.head.appendChild(s);
    });
  }
  return plotlyPromise;
}
function plotLayout(extra) {
  return Object.assign({
    margin: { l: 48, r: 12, t: 8, b: 36 }, paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
    font: { family: 'Roboto, sans-serif', color: '#5B6372', size: 12 }, hovermode: 'x unified',
    legend: { orientation: 'h', x: 0, y: 1.02, yanchor: 'bottom' },
    xaxis: { type: 'date', gridcolor: '#E1E6EE', linecolor: '#E1E6EE', tickformat: '%-d %b %Y', nticks: 5, fixedrange: true },
    yaxis: { title: { text: 'kWh' }, gridcolor: '#E1E6EE', linecolor: '#E1E6EE', rangemode: 'tozero', fixedrange: true }
  }, extra || {});
}
function chartFallback(id) {
  const el = $(id);
  if (el) { el.innerHTML = '<p class="m-text">The chart could not load. The numbers are still in the table.</p>'; el.style.height = 'auto'; }
}

/* ------------------------------------------------------------------
   Carbon note for the bottom bar
------------------------------------------------------------------- */
// The CO2 numbers use the same unit, so they can be compared at a glance.
function co2Unit(maxKg) { return maxKg >= 10000 ? { div: 1000, name: 'tonnes' } : { div: 1, name: 'kg' }; }
function fmtCo2(kg, unit) { return fmt(kg / unit.div) + ' ' + unit.name; }
const CAR_KG_PER_KM = 0.17; // UK government average car, about 0.17 kg CO2e for every km driven
function roundSig(n, sig) { if (!(n > 0)) return 0; const f = Math.pow(10, Math.floor(Math.log10(n)) - sig + 1); return Math.round(n / f) * f; }
function co2Html(total) {
  // One range: the UK's average electricity (low) to natural gas (high), with a car distance to give the numbers a size.
  const grid = total * CO2_KG_PER_KWH.grid, gas = total * CO2_KG_PER_KWH.gas;
  const unit = co2Unit(gas);
  const kmLow = roundSig(grid / CAR_KG_PER_KM, 2), kmHigh = roundSig(gas / CAR_KG_PER_KM, 2);
  return `
    <div class="total-co2">
      <div class="co2-head"><span class="co2-title">Avoided greenhouse emissions</span><button class="co2-info" id="co2Info" type="button" aria-label="How we worked this out" title="How we worked this out">?</button></div>
      <div class="co2-big">${fmt(grid / unit.div)} to ${fmt(gas / unit.div)} ${unit.name} CO₂e</div>
      <div class="co2-sub">kept out of the air, compared with the UK's average electricity and with gas power</div>
      ${kmHigh >= 1 ? `<div class="co2-car">About the same as driving a car ${fmt(kmLow)} to ${fmt(kmHigh)} km</div>` : ''}
    </div>`;
}
function openCo2Info() {
  openModal(`
    <h2 id="modalTitle">How we worked out the avoided greenhouse gas emissions</h2>
    <p class="m-text">Every reading is turned into kWh, as an estimate for one day. We add up all the schools' days.</p>
    <p class="m-text">Then we ask: if the same amount of electricity had come from other power, how many greenhouse gases would have gone into the air? We show two answers. The low one uses the UK's average electricity. The high one uses natural gas, which is what wind and solar mostly replace.</p>
    <p class="m-text">We measure greenhouse gases as <strong>CO₂e</strong>, which stands for "carbon dioxide equivalent". Carbon dioxide is not the only greenhouse gas. Natural gas also leaks methane, which warms the planet too. CO₂e adds all of them together, as if they were all carbon dioxide.</p>
    <ul class="m-list">
      <li><strong>UK average electricity:</strong> about ${CO2_KG_PER_KWH.grid} kg for every kWh (2024)</li>
      <li><strong>Natural gas:</strong> about ${CO2_KG_PER_KWH.gas} kg of CO₂e for every kWh</li>
      <li><strong>Car:</strong> about ${CAR_KG_PER_KM} kg of CO₂e for every km driven (the UK government average car)</li>
    </ul>
    <p class="m-text">The UK figure counts the carbon dioxide from power stations in 2024. The gas figure counts the whole life of a gas power station (IPCC 2014, Working Group III, Annex III). So the two are not exactly like for like.</p>
    <p class="m-text">Coal is not in the list because the UK's last coal power station closed on 30 September 2024.</p>
    <p class="m-text">Solar panels and wind turbines make a small amount of greenhouse gas when they are built (about ${CO2_KG_PER_KWH.sun} kg of CO₂e per kWh for rooftop solar and ${CO2_KG_PER_KWH.wind} kg for wind on land). We have not taken that off the numbers.</p>
    <p class="m-text">The car distance is rounded and is only a rough guide. This is an estimate to show why clean energy matters. It is not a measurement of what any school really saved.</p>`);
}

/* ------------------------------------------------------------------
   How the energy numbers are worked out
------------------------------------------------------------------- */
function openEnergyInfo() {
  const diameter = Math.round(2 * Math.sqrt(ROTOR_M2 / Math.PI));
  openModal(`
    <h2 id="modalTitle">How we work out the energy</h2>
    <p class="m-text">Schools measure the sun and the wind. We turn each reading into the energy that some equipment could make in one day. It is an estimate to help us learn. It is not real electricity from the school.</p>
    <ul class="m-list">
      <li><strong>Sun:</strong> ${PANEL_M2} m² of solar panels that are ${Math.round(PANEL_EFF * 100)}% efficient, with ${SUN_HOURS} hours of sun.</li>
      <li><strong>Wind:</strong> a wind turbine in your town with a rotor about ${diameter} m wide (${ROTOR_M2} m²) that is ${Math.round(WIND_EFF * 100)}% efficient, with ${WIND_HOURS} hours at that wind speed.</li>
    </ul>
    <p class="m-text">A turbine does not turn when the wind is below ${WIND_CUT_IN} m/s, so it makes no energy. Wind above ${WIND_MAX_MS} m/s is counted as ${WIND_MAX_MS} m/s. Wind near the ground is usually slower than the wind high up where a turbine sits.</p>
    <p class="m-text">If a school logs more than once in a day, we use the average for that day. So logging more often does not make the total bigger.</p>
    <p class="m-text">The sun equipment and the wind equipment are different sizes. So please do not use the numbers to say that wind is better than sun.</p>`);
}

/* ------------------------------------------------------------------
   "My school's data": unlock, table, graph, download
------------------------------------------------------------------- */
const unlocked = {}; // school id -> true once the school code has been accepted in this visit

// For now the code is checked with a test-mode reading that is never saved.
// TODO: swap for a proper "verify" call once the Sheet script has one.
function verifyCode(school, code) {

    .then(res => res.ok || !['bad_key', 'unknown_school', 'not_set_up', 'server_error'].includes(res.error));

function onDataClick(school) {

function openUnlock(school) {
  openModal(`
    <h2 id="modalTitle">Is this your school?</h2>
    <p class="m-text">To see or download ${esc(school.name)}'s data, please type your school code.</p>
    <form id="unlockForm" class="log-form" novalidate>

  $('un-code').value = getSavedCode();
  const msg = (kind, t, b) => { $('un-msg').innerHTML = '<div class="lf-msg ' + kind + '"><span>' + esc(t) + '</span>' + (b ? '<p>' + esc(b) + '</p>' : '') + '</div>'; };
  $('unlockForm').addEventListener('submit', ev => {
    ev.preventDefault();

    verifyCode(school, code).then(ok => {

function buildRows(readings) {
  return readings.map(r => ({
    date: r.date, time: padTime(r.time),
    solar: r.type === 'solar' ? r.kwh : null, wind: r.type === 'wind' ? r.kwh : null
  })).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
}
function csvCell(v) {
  let s = v == null ? '' : String(v);
  if (typeof v === 'string' && /^[=+\-@]/.test(s)) s = "'" + s; // stops spreadsheets running a name as a formula
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(school, rows) {
  const lines = [['School', 'Date', 'Time', 'Solar (kWh)', 'Wind (kWh)'].map(csvCell).join(',')];
  rows.forEach(r => lines.push([school.name, r.date, r.time, r.solar, r.wind].map(csvCell).join(',')));
  return lines.join('\r\n');
}
function downloadCSV(school, rows) {
  const blob = new Blob(['﻿' + toCSV(school, rows)], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = school.id + '-energy-data.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function drawSchoolChart(readings) {
  loadPlotly().then(() => {
    const el = $('dv-chart'); if (!el || !readings.length) return;
    const x = readings.map(r => toTs(r.date, r.time));
    const t0 = x[0], t1 = x[x.length - 1], pad = Math.max((t1 - t0) * 0.05, 86400000);
    const last = readings[readings.length - 1];
    const trace = (name, key, color) => ({
      x: x.concat([t1 + pad]), y: readings.map(r => r[key]).concat([last[key]]), name, type: 'scatter', mode: 'lines', stackgroup: 'one',
      line: { color, width: 2, shape: 'hv' }, fillcolor: hexA(color, 0.35), hovertemplate: name + ': %{y:.1f} kWh<extra></extra>'
    });
    Plotly.react(el, [trace('Sun', 'runningSolar', '#EA168E'), trace('Wind', 'runningWind', '#1EAFED')], plotLayout(), { displayModeBar: false, responsive: true });
  }).catch(() => chartFallback('dv-chart'));
}

function openDataView(school) {
  openModal(`<h2 id="modalTitle">${esc(school.name)}</h2><p class="m-text">Loading your data…</p>`);
  return getDetail(school).then(d => {
    const rows = buildRows(d.readings), t = d.totals;
    if (!rows.length) {
      modalBody.innerHTML = `<h2 id="modalTitle">${esc(school.name)}</h2><p class="m-text">No readings yet. Once your school adds a reading, you can see and download it here.</p>`;
      return;
    }
    const fmtCell = v => (v == null ? '' : fmt(v, 3));
    modalBody.innerHTML = `
      <h2 id="modalTitle">${esc(school.name)}: my data</h2>
      <p class="m-text">${t.count} readings on ${t.days} day${t.days === 1 ? '' : 's'}, and ${fmt(t.total)} kWh in total: ${fmt(t.solar)} kWh from the sun and ${fmt(t.wind)} kWh from the wind.</p>
      <div class="m-actions"><button class="panel-btn primary" id="dv-download" type="button">Download my data (CSV)</button></div>
      <div id="dv-chart" class="data-chart" role="img" aria-label="Energy we could make over time, split into sun and wind"></div>
      <div class="data-table-wrap"><table class="data">
        <thead><tr><th>School</th><th>Date</th><th>Time</th><th class="n">Solar (kWh)</th><th class="n">Wind (kWh)</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td>${esc(school.name)}</td><td>${esc(r.date)}</td><td>${esc(r.time)}</td><td class="n">${fmtCell(r.solar)}</td><td class="n">${fmtCell(r.wind)}</td></tr>`).join('')}</tbody>
      </table></div>`;
    $('dv-download').addEventListener('click', () => downloadCSV(school, rows));
    drawSchoolChart(d.readings);
  }).catch(() => {
    modalBody.innerHTML = `<h2 id="modalTitle">${esc(school.name)}</h2><p class="m-text">We couldn't load your data. Please try again in a minute.</p>`;
  });
}

/* ------------------------------------------------------------------
   Compare two schools
------------------------------------------------------------------- */
const compare = { active: false, picks: [] };
const CMP_COLORS = ['#EA168E', '#1EAFED']; // brand pink and blue, the same as the pins and dials
const compareBar = $('compareBar');
const compareBtn = $('compareBtn');

function updateCompareBar() {
  compareBar.hidden = false;
  const n = compare.picks.length;
  $('compareMsg').textContent = n === 0 ? 'Click the first school you want to compare.'
    : 'Now click a second school to compare with ' + compare.picks[0].name + '.';
}
function startCompare() {
  compare.active = true; compare.picks = [];
  panel.hidden = true; hint.style.display = 'none';
  clearActiveMarkers();
  compareBtn.classList.add('on');
  updateCompareBar();
}
function cancelCompare() {
  compare.active = false; compare.picks = [];
  clearActiveMarkers();
  compareBar.hidden = true; compareBtn.classList.remove('on');
  if (panel.hidden) hint.style.display = '';
}
function comparePick(school) {
  if (compare.picks.some(s => s.id === school.id)) return;
  compare.picks.push(school);
  const e = markers[school.id].getElement(); if (e) e.classList.add('active');
  if (compare.picks.length < 2) { updateCompareBar(); return; }
  const [a, b] = compare.picks;
  compare.active = false; compare.picks = [];
  compareBar.hidden = true; compareBtn.classList.remove('on');
  openCompare(a, b);
}
compareBtn.addEventListener('click', () => { if (compare.active) cancelCompare(); else startCompare(); });
$('compareCancel').addEventListener('click', cancelCompare);

const COUNTRY_DEFAULT = 'UK'; // the Sheet has no country column yet. When it does, a school's country is used instead.
function schoolLabel(s) { return s.name + ', ' + (s.country || COUNTRY_DEFAULT); }
function distanceKm(a, b) {
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(b.latitude - a.latitude), dLon = rad(b.longitude - a.longitude);
  const h = Math.pow(Math.sin(dLat / 2), 2) + Math.cos(rad(a.latitude)) * Math.cos(rad(b.latitude)) * Math.pow(Math.sin(dLon / 2), 2);
  return 2 * R * Math.asin(Math.sqrt(h));
}
function distanceText(a, b) {
  const km = distanceKm(a, b), mi = km * 0.621371;
  if (km < 1) return 'Less than 1 km apart';
  const r = v => (v < 10 ? String(Math.round(v * 10) / 10) : fmt(Math.round(v)));
  return 'About ' + r(km) + ' km (' + r(mi) + ' miles) apart';
}

/* Sun and wind strength icons. The level (1 to 3) comes from a school's average reading compared with the dial's top value. */
function mixColor(p) {
  const a = [234, 22, 142], b = [30, 175, 237]; // Sustain/Ed pink (low) to blue (high)
  return 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * p)).join(',') + ')';
}
const LEVEL_WORDS = ['', 'gentle', 'medium', 'strong'];
function levelOf(avg, max) {
  if (avg == null || !isFinite(avg)) return 0;
  const p = avg / max;
  return p < 1 / 3 ? 1 : (p < 2 / 3 ? 2 : 3);
}
function sunStrengthIcon(level) {
  const c = '#333745', r = [4, 5, 6][level - 1], n = [4, 6, 8][level - 1]; // dark ink, so colour only ever means 'which school'. Strength shows in the shape.
  let rays = '';
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 * i) / n, r1 = r + 3, r2 = r + 3 + [2.5, 3.5, 4][level - 1];
    rays += `<line x1="${(14 + r1 * Math.cos(a)).toFixed(1)}" y1="${(14 + r1 * Math.sin(a)).toFixed(1)}" x2="${(14 + r2 * Math.cos(a)).toFixed(1)}" y2="${(14 + r2 * Math.sin(a)).toFixed(1)}"/>`;
  }
  return `<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><g stroke="${c}" stroke-width="2" stroke-linecap="round">${rays}</g><circle cx="14" cy="14" r="${r}" fill="${c}"/></svg>`;
}
function windStrengthIcon(level) {
  const c = '#333745', ys = level === 1 ? [14] : (level === 2 ? [11, 19] : [8, 14, 20]);
  const lines = ys.map(y => `<path d="M3 ${y} H17 a3 3 0 1 0 -3 -3"/>`).join('');
  return `<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><g fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round">${lines}</g></svg>`;
}
function avgOf(readings, type) {
  const v = readings.filter(r => r.type === type).map(r => Number(r.reading)).filter(x => isFinite(x));
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}

function schoolStats(school, d) {
  const t = d.totals;
  return {
    label: schoolLabel(school), total: t.total, solar: t.solar, wind: t.wind, count: t.count, days: t.days, avg: t.days ? t.total / t.days : 0,
    sunLevel: levelOf(avgOf(d.readings, 'solar'), SOLAR_MAX_LUX),
    windLevel: levelOf(avgOf(d.readings, 'wind'), WIND_MAX_MS)
  };
}

function renderCompare(stats, a, b) {
  const row = (k, x, y) => `<tr><td class="k">${k}</td><td>${x}</td><td>${y}</td></tr>`;
  const both = (k, f) => row(k, f(stats[0]), f(stats[1]));
  // A row with a small bar under each number, so it is easy to see who has more. The bigger number is bold.
  const barRow = (k, key, render) => {
    const vals = stats.map(s => s[key] || 0), max = Math.max(...vals), tie = vals[0] === vals[1];
    const cell = (s, i) => {
      const sum = vals[0] + vals[1];
      const w = sum > 0 && vals[i] > 0 ? Math.max(3, Math.round(vals[i] / sum * 100)) : 0; // each bar is that school's share of both schools together
      return `<div class="${!tie && vals[i] === max ? 'cmp-lead' : ''}">${render(s)}</div><div class="cmp-bar" aria-hidden="true"><i style="width:${w}%;background:${CMP_COLORS[i]}"></i></div>`;
    };
    return row(k, cell(stats[0], 0), cell(stats[1], 1));
  };
  const kwh = v => (v == null ? '–' : fmt(v) + ' kWh');
  const withIcon = (text, level, icon, name) => level
    ? `<span class="cmp-val" title="${name} strength: ${LEVEL_WORDS[level]}">${icon(level)}<span>${text}</span><span class="cmp-sr"> (${name.toLowerCase()} strength: ${LEVEL_WORDS[level]})</span></span>`
    : text;
  modalBody.innerHTML = `
    <h2 id="modalTitle">Compare schools</h2>
    <div class="data-table-wrap"><table class="cmp">
      <thead><tr><th></th>${stats.map((s, i) => `<th><span class="dot" style="background:${CMP_COLORS[i]}"></span>${esc(s.label)}</th>`).join('')}</tr></thead>
      <tbody>
        ${barRow('Total energy we could make', 'total', s => kwh(s.total))}
        ${barRow('From the sun', 'solar', s => withIcon(kwh(s.solar), s.sunLevel, sunStrengthIcon, 'Sun'))}
        ${barRow('From the wind', 'wind', s => withIcon(kwh(s.wind), s.windLevel, windStrengthIcon, 'Wind'))}
        ${barRow('Average per day', 'avg', s => kwh(s.avg))}
        ${both('Days measured', s => String(s.days))}
        <tr><td class="k">Distance between the schools</td><td class="span" colspan="2">${esc(distanceText(a, b))}</td></tr>
      </tbody></table></div>
    <div class="m-actions"><button class="panel-btn ghost" id="cmp-again" type="button">Compare different schools</button></div>`;
  $('cmp-again').addEventListener('click', () => { closeModal(); startCompare(); });
}

function openCompare(a, b) {
  modalOnClose = clearActiveMarkers;
  openModal('<h2 id="modalTitle">Compare schools</h2><p class="m-text">Loading both schools…</p>');
  Promise.all([getDetail(a), getDetail(b)])
    .then(([da, db]) => renderCompare([schoolStats(a, da), schoolStats(b, db)], a, b))
    .catch(() => { modalBody.innerHTML = '<h2 id="modalTitle">Compare schools</h2><p class="m-text">We couldn\'t load these schools. Please try again in a minute.</p>'; });
}

/* ------------------------------------------------------------------
   Log a reading from the top of the page. This is how a school with no pin yet adds its first reading.
------------------------------------------------------------------- */
function openSchoolPicker() {
  if (!allSchools.length) return;
  const opts = [...allSchools].sort((x, y) => x.name.localeCompare(y.name)).map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
  openModal(`
    <h2 id="modalTitle">Which school are you?</h2>
    <p class="m-text">Pick your school, then add your reading.</p>
    <div class="log-form">
      <div class="lf-field"><label class="lf-label" for="pick-school">My school</label>
        <select class="lf-text" id="pick-school"><option value="">Choose your school…</option>${opts}</select></div>
      <div id="pick-msg" aria-live="polite"></div>
      <div class="m-actions"><button class="panel-btn primary" id="pick-go" type="button">Continue</button></div>
    </div>`);
  $('pick-go').addEventListener('click', () => {

    clearActiveMarkers();
    const mk = markers[sc.id];
    if (mk && mk.getElement()) mk.getElement().classList.add('active');
    openForm(sc);
  });
}
$('logHeaderBtn').addEventListener('click', openSchoolPicker);

/* ------------------------------------------------------------------
   Find your school: type part of the name, then pick it from the list
------------------------------------------------------------------- */
const findInput = $('findInput'), findList = $('findList');
function findHits() {
  const q = findInput.value.trim().toLowerCase();
  if (!q) return [];
  const pool = compare.active ? schools : allSchools; // while comparing, only schools with a pin can be picked
  return pool.filter(s => s.name.toLowerCase().includes(q))
    .sort((a, b) => (b.name.toLowerCase().startsWith(q) - a.name.toLowerCase().startsWith(q)) || a.name.localeCompare(b.name))
    .slice(0, 8);
}
function renderFind() {
  const hits = findHits();
  if (!findInput.value.trim()) { findList.hidden = true; findList.innerHTML = ''; return; }
  findList.innerHTML = hits.length
    ? hits.map(s => `<li role="presentation"><button type="button" role="option" data-id="${esc(s.id)}">${esc(s.name)}${markers[s.id] ? '' : '<span class="find-note">No readings yet. Be the first!</span>'}</button></li>`).join('')
    : '<li class="find-empty">No school found. Please check the spelling.</li>';
  findList.hidden = false;
}
function closeFind() { findList.hidden = true; findList.innerHTML = ''; findInput.value = ''; }
function goToSchool(school) {
  closeFind(); findInput.blur();
  map.flyTo([school.latitude, school.longitude], Math.max(map.getZoom(), 11), { duration: 0.8 });
  if (compare.active) { if (markers[school.id]) comparePick(school); return; }
  clearActiveMarkers();
  const mk = markers[school.id];
  if (mk && mk.getElement()) mk.getElement().classList.add('active');
  openPanel(school);
}
if (typeof MutationObserver !== 'undefined') {
  new MutationObserver(() => document.body.classList.toggle('panel-open', !panel.hidden)).observe(panel, { attributes: true, attributeFilter: ['hidden'] });
}
findInput.addEventListener('input', renderFind);
findInput.addEventListener('focus', renderFind);
findInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const h = findHits(); if (h.length) { e.preventDefault(); goToSchool(h[0]); } }
  else if (e.key === 'Escape') closeFind();
  else if (e.key === 'ArrowDown') { const b = findList.querySelector('button'); if (b) { e.preventDefault(); b.focus(); } }
});
findList.addEventListener('keydown', e => {
  const btns = [...findList.querySelectorAll('button')], i = btns.indexOf(document.activeElement);
  if (e.key === 'ArrowDown' && i < btns.length - 1) { e.preventDefault(); btns[i + 1].focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); (i > 0 ? btns[i - 1] : findInput).focus(); }
  else if (e.key === 'Escape') { closeFind(); findInput.focus(); }
});
findList.addEventListener('click', e => {
  const b = e.target.closest('button[data-id]'); if (!b) return;
  const sc = allSchools.find(x => x.id === b.dataset.id); if (sc) goToSchool(sc);
});
document.addEventListener('click', e => { if (!e.target.closest('.find-wrap')) { findList.hidden = true; } });

/* ------------------------------------------------------------------
   Start: load the schools from the Sheet, then draw everything
------------------------------------------------------------------- */
map.setView([53.5, -2.5], 6);
totalBar.innerHTML = '<div class="total-stat-text"><span class="total-sub">Loading schools…</span></div>';

api({ action: 'schools' })
  .then(d => {
    // "Show on map" in the Schools tab decides which schools are included (e.g. private homes stay hidden).
    allSchools = d.schools.filter(s => s.showOnMap);
    const withData = allSchools.filter(s => s.readings > 0);
    // Load every school with readings, so the totals and milestones use the new formulas.
    return Promise.all(withData.map(s => loadDetail(s.id))).then(() => { schools = withData; });
  })
  .then(() => { renderTotalBar(); addMarkers(); })
  .catch(() => {
    totalBar.innerHTML = '<div class="total-stat-text"><span class="total-sub">We couldn\'t load the schools just now. Please refresh the page.</span></div>';
  });

</script>
</body>
