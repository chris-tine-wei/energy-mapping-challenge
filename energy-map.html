<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Energy Mapping Challenge</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">

  <style>
    html, body { margin: 0; height: 100%; font-family: 'Roboto', sans-serif; }
    body { display: flex; flex-direction: column; }
    #map { flex: 1; min-height: 0; width: 100%; }
    .panel {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: 360px;
  max-width: 90vw;
  background: #FFFFFF;
  border-radius: 0;
  border-left: 1px solid rgba(51,55,69,0.14);
  box-shadow: -4px 0 20px rgba(0,0,0,.12);
  padding: 20px;
  z-index: 1000;
  overflow-y: auto;
  font-family: 'Roboto', sans-serif;
}
.panel[hidden] { display: none; }
.panel-close {
  position: absolute; top: 12px; right: 16px;
  border: none; background: #EAF4EE; width: 30px; height: 30px;
  border-radius: 50%; font-size: 18px; cursor: pointer;
}
.panel h2 { font-family: var(--font-heading); margin: 0 24px 14px 0; }
.bar-row { margin-bottom: 14px; }
.bar-label { font-size: 12px; font-weight: 600; color: #5B6372; margin-bottom: 4px; }
.bar-track { background: #EAF4EE; border-radius: 999px; height: 10px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; }
.panel-btn-row { display: flex; gap: 10px; margin-top: 16px; }
.panel-btn {
  flex: 1; padding: 10px; border-radius: 999px; border: none; font-weight: 700;
  font-family: 'Roboto', sans-serif; cursor: pointer;
}
.panel-btn.primary { background: #1EAFED; color: white; }
.panel-btn.ghost { background: #EAF4EE; color: #333745; }

.panel-region { font-size: 12px; color: #5B6372; margin: -8px 0 14px; }
.relatable {
  background: #FBD9EA; color: #333745; border-radius: 14px;
  padding: 12px 14px; font-size: 14px; font-weight: 700;
  display: flex; gap: 10px; align-items: center; margin-bottom: 14px;
}
.relatable svg { flex: 0 0 auto; }
.more-box { background: #EAF4EE; border-radius: 14px; padding: 14px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px; }
.unlock-badge { background: #1EAFED; color: white; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding: 4px 10px; border-radius: 999px; align-self: flex-start; }
.more-title { font-weight: 800; font-size: 15px; color: #333745; font-family: var(--font-heading); }
.more-text { font-size: 13px; color: #5B6372; }
.trend-label { font-size: 11px; font-weight: 700; color: #5B6372; text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
.trend { display: flex; align-items: flex-end; gap: 4px; }
.tb { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-end; gap: 2px; }
.tb i { display: block; background: #D3EFFB; border-radius: 3px 3px 0 0; }
.tv { font-size: 10.5px; font-weight: 600; color: #5B6372; text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tb.newest i { background: #1EAFED; }
.tb.newest .tv { color: #333745; font-weight: 800; }
.next-milestone { font-size: 13px; font-weight: 700; color: #1EAFED; margin-top: 2px; }
#totalBar {
  flex: 0 0 auto;
  background: linear-gradient(90deg, #1EAFED, #EA168E);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
  padding: 14px 24px;
  flex-wrap: wrap;
  animation: totalBarIn .6s ease;
}
@keyframes totalBarIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.total-stat { display: flex; align-items: center; gap: 14px; }
.total-icon { flex: 0 0 auto; }
.total-stat-text { display: flex; flex-direction: column; line-height: 1.15; }
.total-number { font-family: var(--font-heading); font-size: 40px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
.total-sub { font-size: 15px; font-weight: 700; opacity: .98; }
.total-badge { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; margin-top: 8px; background: #fff; color: #333745; border-radius: 999px; padding: 5px 14px 5px 6px; font-size: 13px; line-height: 1.2; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.total-badge-icon { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #FBD9EA; font-size: 16px; }
.total-badge strong { color: #EA168E; }
.total-progress { display: flex; flex-direction: column; gap: 4px; min-width: 180px; }
.total-progress-track { width: 100%; height: 8px; background: rgba(255,255,255,.35); border-radius: 999px; overflow: hidden; }
.total-progress-fill { width: 0%; height: 100%; background: #fff; border-radius: 999px; transition: width 1s ease; }
.total-progress-label { font-size: 11px; font-weight: 700; }

.battery-row { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.battery-label { width:50px; font-size:13px; font-weight:700; color:#333745; }
.battery-pct { font-size:14px; font-weight:800; color:#333745; }
.pin-circle {
  width: 32px; height: 32px; border-radius: 50%;
  background: #EA168E; border: 3px solid white;
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
  display: flex; align-items: center; justify-content: center;
  transition: background .15s ease;
}
.school-pin:hover .pin-circle,
.school-pin.active .pin-circle { background: #1EAFED; }
.reading-grid { display: flex; gap: 12px; margin-bottom: 14px; }
.reading-card {
  flex: 1; background: #EAF4EE; border-radius: 14px; padding: 14px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.reading-label { font-size: 12px; font-weight: 700; color: #5B6372; text-transform: uppercase; letter-spacing: .04em; }
.reading-pct { font-size: 18px; font-weight: 800; color: #333745; }
#hint {
  position: fixed; top: 78px; left: 50%; transform: translateX(-50%);
  background: #FFFFFF; border: 1px solid rgba(51,55,69,0.14);
  box-shadow: 0 4px 14px rgba(0,0,0,.12); padding: 8px 16px;
  border-radius: 999px; font-weight: 700; font-size: 13px;
  color: #333745; z-index: 500; pointer-events: none;
}
header {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px;
  background: #FFFFFF;
  border-bottom: 1px solid rgba(51,55,69,0.14);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand h1 { font-family: var(--font-heading); font-size: 22px; font-weight: 700; margin: 0; color: #333745; line-height: 1.2; }
.brand-subtitle { font-size: 12.5px; font-weight: 500; color: #5B6372; margin: 2px 0 0; }
.brand-logo { height: 53px; width: auto; flex: 0 0 auto; margin: -4.5px 0; } /* 20% bigger, but the negative margin keeps the white bar at its original height */
.compare-btn {
  background: #EAF4EE; color: #333745; border: none; border-radius: 999px;
  padding: 10px 18px; font-weight: 700; font-family: 'Roboto', sans-serif;
  font-size: 14px; cursor: pointer;
}
  .school-pin.no-data .pin-circle { background: #9AA3B2; }
.school-pin.no-data:hover .pin-circle, .school-pin.no-data.active .pin-circle { background: #1EAFED; }
.status-dark { color: #5B6372; font-weight: 600; }
.panel-btn:disabled { opacity: .5; cursor: not-allowed; }
/* Log a reading form */
.lf-back { border: 0; background: none; color: #1EAFED; font: 700 14px 'Roboto', sans-serif; cursor: pointer; padding: 0; margin: 0 0 10px; }
.log-form { display: grid; gap: 16px; }
.log-form fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 0; }
.log-form legend, .lf-label { font-weight: 800; font-size: 15px; color: #333745; padding: 0; }
.lf-field { display: grid; gap: 6px; }
.lf-hint { font-size: 13px; color: #5B6372; margin: 0; font-weight: 400; }
.lf-type { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lf-type input, .lf-weather input { position: absolute; opacity: 0; pointer-events: none; }
.lf-type label { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 10px 8px; border: 2px solid #D9DEE6; border-radius: 14px; background: #fff; cursor: pointer; font-family: var(--font-heading); font-weight: 700; font-size: 17px; }
#t-solar:checked + label { border-color: #EA168E; background: #FBD9EA; }
#t-wind:checked + label { border-color: #1EAFED; background: #D3EFFB; }
.lf-type input:focus-visible + label, .lf-weather input:focus-visible + label { outline: 3px solid #333745; outline-offset: 2px; }
.lf-reading-row { display: flex; border: 2px solid #D9DEE6; border-radius: 14px; overflow: hidden; background: #fff; }
.lf-reading-row:focus-within { border-color: #1EAFED; }
.lf-reading-row input { flex: 1; min-width: 0; border: 0; padding: 10px 12px; font: 800 24px 'Roboto', sans-serif; background: transparent; }
.lf-reading-row input:focus { outline: none; }
.lf-unit { display: flex; align-items: center; padding: 0 14px; background: #EAF4EE; font-weight: 800; color: #5B6372; }
.lf-preview { border-radius: 14px; padding: 12px 14px; background: #EAF4EE; display: grid; gap: 3px; min-height: 76px; }
.lf-preview.solar { background: #FBD9EA; }
.lf-preview.wind { background: #D3EFFB; }
.lf-big { font-family: var(--font-heading); font-size: 22px; font-weight: 700; color: #333745; }
.lf-equiv { font-size: 14px; color: #333745; }
.lf-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lf-two label { display: grid; gap: 6px; min-width: 0; }
.lf-two input, .lf-text { padding: 10px 12px; border: 2px solid #D9DEE6; border-radius: 12px; font: 16px 'Roboto', sans-serif; background: #fff; width: 100%; min-width: 0; box-sizing: border-box; }
.lf-weather { display: flex; flex-wrap: wrap; gap: 8px; }
.lf-weather label { padding: 8px 14px; border: 2px solid #D9DEE6; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 14px; background: #fff; }
.lf-weather input:checked + label { border-color: #1EAFED; background: #D3EFFB; }
.lf-switch { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: #5B6372; cursor: pointer; }
.lf-switch input { width: 18px; height: 18px; margin-top: 1px; accent-color: #1EAFED; }
.lf-submit { width: 100%; min-height: 52px; font-size: 16px; flex: none; }
.lf-error { color: #B3261E; font-weight: 700; font-size: 14px; margin: 0; }
.lf-warn { color: #8A5A00; background: #FFF3D6; border-radius: 10px; padding: 8px 10px; font-weight: 700; font-size: 14px; margin: 0; }
.lf-msg { border-radius: 14px; padding: 12px 14px; font-weight: 700; display: grid; gap: 4px; }
.lf-msg p { font-weight: 500; color: #333745; margin: 0; }
.lf-msg.ok { background: #E0F3E6; color: #0A7A2F; }
.lf-msg.err { background: #FBE5E3; color: #B3261E; }
.lf-msg.note { background: #FFF3D6; color: #8A5A00; }
:root { --font-heading: 'Tisa Offc Serif Pro', 'Source Serif 4', Georgia, serif; }
.total-co2 { display: flex; flex-direction: column; gap: 3px; font-size: 12px; line-height: 1.2; border-left: 1px solid rgba(255,255,255,.5); padding-left: 22px; width: min(310px, 100%); }
.co2-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
.co2-title { font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.co2-info { flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #fff; background: transparent; color: #fff; font: 800 12px 'Roboto', sans-serif; line-height: 1; padding: 0; cursor: pointer; }
.co2-bar-row { display: grid; grid-template-columns: 82px 1fr 64px; align-items: center; gap: 8px; border-radius: 999px; padding: 2px 8px; }
.co2-label { font-weight: 700; white-space: nowrap; }
.co2-track { height: 8px; background: rgba(255,255,255,.3); border-radius: 999px; overflow: hidden; }
.co2-fill { display: block; height: 100%; background: #fff; border-radius: 999px; }
.co2-num { font-family: var(--font-heading); font-weight: 700; font-size: 13px; text-align: right; white-space: nowrap; }
.co2-bar-row.dim { opacity: .75; }
.co2-bar-row.best { background: rgba(255,255,255,.22); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.85); font-weight: 800; padding: 5px 8px; margin-top: 3px; }
.co2-bar-row.best .co2-label { color: #fff; }
.co2-bar-row.best .co2-track { background: rgba(255,255,255,.3); height: 10px; }
.co2-bar-row.best .co2-fill { background: #fff; }
.co2-bar-row.best .co2-num { color: #fff; font-size: 14px; }
.compare-btn.on { background: #333745; color: #fff; }
.compare-bar { position: fixed; top: 96px; left: 50%; transform: translateX(-50%); z-index: 1100; background: #333745; color: #fff; border-radius: 999px; padding: 10px 12px 10px 20px; display: flex; align-items: center; gap: 14px; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 92vw; }
.compare-bar[hidden] { display: none; }
.compare-cancel { border: 0; border-radius: 999px; background: #fff; color: #333745; font: 700 13px 'Roboto', sans-serif; padding: 7px 14px; cursor: pointer; }
.modal { position: fixed; inset: 0; z-index: 2000; background: rgba(51,55,69,.5); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal[hidden] { display: none; }
.modal-card { position: relative; background: #fff; border-radius: 20px; width: min(940px, 100%); max-height: 92vh; overflow: auto; padding: 24px 24px 28px; box-shadow: 0 20px 60px rgba(0,0,0,.3); font-family: 'Roboto', sans-serif; color: #333745; }
.modal-card h2 { font-family: var(--font-heading); margin: 0 36px 6px 0; font-size: 24px; }
.modal-card h3 { font-family: var(--font-heading); font-size: 17px; margin: 20px 0 6px; }
.m-text { color: #5B6372; margin: 0 0 12px; font-size: 14px; }
.m-sub { color: #5B6372; font-size: 12px; font-weight: 500; }
.m-list { margin: 0 0 12px; padding-left: 20px; font-size: 14px; }
.m-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
.m-actions .panel-btn { flex: 0 0 auto; padding: 10px 18px; }
.data-chart { width: 100%; height: 280px; }
.data-table-wrap { overflow: auto; max-height: 320px; border: 1px solid #E1E6EE; border-radius: 12px; margin-top: 12px; }
table.data, table.cmp { border-collapse: collapse; width: 100%; font-size: 14px; }
table.data th, table.data td, table.cmp th, table.cmp td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #EEF1F5; }
table.data th, table.cmp thead th { position: sticky; top: 0; background: #EAF4EE; font-weight: 800; }
table.data td, table.data th { white-space: nowrap; }
table.data td.n, table.data th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.cmp thead th { font-family: var(--font-heading); font-size: 16px; }
table.cmp td.k { color: #5B6372; font-weight: 700; width: 28%; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.cmp-battery { display: flex; align-items: center; gap: 8px; font-weight: 800; }
.cmp-battery svg { width: 84px; height: auto; }
.cmp-bat-line { display: flex; align-items: center; gap: 10px; margin: 2px 0; }
.cmp-bat-line > span:first-child { width: 36px; color: #5B6372; font-size: 12px; font-weight: 700; }
@media (max-width: 560px) { .total-co2 { border-left: 0; padding-left: 0; } .total-number { font-size: 32px; } .compare-bar { top: 130px; } }
</style>
</head>

  <script>
const map = L.map('map');

L.tileLayer('https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png?key=cb1_4f1n_1_78afe8bcf5a4043ff6ac084b', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  maxZoom: 19
}).addTo(map);

/* ------------------------------------------------------------------
   Settings. Everything the map needs to know lives here.
------------------------------------------------------------------- */
// The Google Sheet script that holds the schools and readings.
const API_URL = 'https://script.google.com/macros/s/AKfycbwEGWzVVU6ySlKbe2to-H8_tQkYATB-vHoSsFi62l_ndXTNONfPmJ9Upe3n4UlPbC0/exec';

// Battery ranges, as set by Beth: the sun battery fills from 0 to 1200 lux and the wind battery from 0 to 12 m/s.
const SOLAR_MAX_LUX = 1200;
const WIND_MAX_MS = 12;

// Carbon figures: median whole-life CO2 per kWh of electricity (IPCC 2014, Working Group III, Annex III).
// Coal in a standard power station is 820 g and gas in a combined-cycle plant is 490 g.
const CO2_KG_PER_KWH = { coal: 0.82, gas: 0.49, sun: 0.041, wind: 0.011 }; // sun = rooftop solar panels, wind = onshore wind (same IPCC table)

/* ------------------------------------------------------------------
   Helpers
------------------------------------------------------------------- */
const $ = id => document.getElementById(id);
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function fmt(n) {
  if (n === null || n === undefined || isNaN(n)) return '–';
  const dp = n < 10 ? 2 : n < 100 ? 1 : 0;
  return Number(n).toLocaleString('en-GB', { maximumFractionDigits: dp });
}
function fmtDate(iso) {
  const d = new Date(iso + 'T12:00:00');
  return isNaN(d) ? iso : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}
function api(params) {
  return fetch(API_URL + '?' + new URLSearchParams(params).toString())
    .then(r => r.json())
    .then(d => { if (!d.ok) throw new Error(d.error || 'api_error'); return d; });
}

let schools = [];        // schools shown on the map (from the Sheet)
let MILESTONES = [];     // every milestone, smallest first (from the Milestones tab)
const details = {};      // school id -> full detail, loaded when a pin is clicked

/* An everyday comparison for an amount of energy. */
function comparison(kwh) {
  if (!(kwh > 0) || !MILESTONES.length) return '';
  let best = null;
  MILESTONES.forEach(m => {
    const times = kwh / m.kwh;
    if (times >= 1 && times <= 60 && (!best || m.kwh > best.m.kwh)) best = { m, times };
  });
  if (!best) {
    if (kwh < MILESTONES[0].kwh) return 'A little bit of energy. Keep measuring!';
    const last = MILESTONES[MILESTONES.length - 1];
    best = { m: last, times: kwh / last.kwh };
  }
  const n = Math.floor(best.times);
  const what = best.m.milestone.charAt(0).toLowerCase() + best.m.milestone.slice(1);
  return `${best.m.icon} That's enough to ${what}${n === 1 ? '.' : ' ' + n + ' times.'}`;
}

/* ------------------------------------------------------------------
   Total bar across the top of the map
------------------------------------------------------------------- */
const totalBar = $('totalBar');

let shownTotal = 0; // the number currently on screen, so the count-up starts from there
let countTimer = null;
function countUp(el, from, to) {
  if (countTimer) clearInterval(countTimer);
  const reduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || from === to) { el.textContent = fmt(to) + ' kWh'; shownTotal = to; return; }
  const start = Date.now(), ms = 1600;
  el.textContent = fmt(from) + ' kWh';
  countTimer = setInterval(() => {
    const p = Math.min(1, (Date.now() - start) / ms), eased = 1 - Math.pow(1 - p, 3);
    shownTotal = from + (to - from) * eased;
    el.textContent = fmt(shownTotal) + ' kWh';
    if (p >= 1) { clearInterval(countTimer); countTimer = null; shownTotal = to; el.textContent = fmt(to) + ' kWh'; }
  }, 30);
}

function renderTotalBar() {
  const total = schools.reduce((sum, s) => sum + s.totals.total, 0);
  const solarTotal = schools.reduce((sum, s) => sum + s.totals.solar, 0);
  const windTotal = schools.reduce((sum, s) => sum + s.totals.wind, 0);
  const active = schools.filter(s => s.readings > 0).length;
  const newest = [...MILESTONES].reverse().find(m => m.kwh <= total);
  const badge = newest
    ? `<span class="total-badge"><span class="total-badge-icon">${esc(newest.icon)}</span><span><strong>Milestone unlocked!</strong> ${esc(newest.milestone)}</span></span>`
    : '';
  totalBar.innerHTML = `
    <div class="total-stat">
      <svg class="total-icon" width="38" height="38" viewBox="0 0 24 24" fill="white"><path d="M13 2 4 14h6l-1 8 10-13h-6z"/></svg>
      <div class="total-stat-text">
        <span class="total-number" id="totalNumber" aria-label="${esc(fmt(total))} kilowatt-hours">${fmt(shownTotal)} kWh</span>
        <span class="total-sub">of clean energy measured by ${active} school${active === 1 ? '' : 's'} so far</span>
        ${badge}
      </div>
    </div>
    ${co2Html(total, solarTotal, windTotal)}
  `;
  const ci = $('co2Info'); if (ci) ci.addEventListener('click', openCo2Info);
  const num = $('totalNumber'); if (num) countUp(num, shownTotal, total);
}

/* ------------------------------------------------------------------
   School panel
------------------------------------------------------------------- */
const panel = $('panel');
const panelBody = $('panelBody');
const hint = $('hint');
$('panelClose').addEventListener('click', () => {
  panel.hidden = true; hint.style.display = '';
  Object.values(markers).forEach(m => m.getElement() && m.getElement().classList.remove('active'));
});

function batteryIcon(pct, color) {
  const fillWidth = Math.max(4, (pct / 100) * 88); // keeps a sliver visible even near 0%
  return `
    <svg width="120" height="48" viewBox="0 0 120 48" aria-hidden="true">
      <rect x="2" y="2" width="104" height="44" rx="10" fill="none" stroke="#333745" stroke-width="4"/>
      <rect x="108" y="16" width="10" height="16" rx="3" fill="#333745"/>
      <rect x="10" y="10" width="${fillWidth}" height="28" rx="6" fill="${color}"/>
    </svg>
  `;
}

      </g>

const WIND_ICON = `

      <g fill="none" stroke="#1EAFED" stroke-width="2.2" stroke-linecap="round">
        <path d="M3 8 H13 a2.6 2.6 0 1 0 -2.6 -2.6"/>
        <path d="M2 13 H16 a2.6 2.6 0 1 1 -2.6 2.6"/>

function readingCard(label, icon, pct, color) {
  return `
  <div class="reading-card">
    <div class="reading-label">${label}</div>
    ${icon}
    ${batteryIcon(pct == null ? 0 : pct, color)}

function renderPanel(school, d) {
  const readings = d.readings;
  const t = d.totals;
  if (!readings.length) {
    panelBody.innerHTML = `
      <h2>${esc(school.name)}</h2>
      <div class="more-box">
        <span class="unlock-badge">Be the first!</span>
        <div class="more-title">No readings yet</div>
        <div class="more-text">This school hasn't measured any sun or wind yet. Once a reading is added, its energy will show up here.</div>
      </div>
      <div class="panel-btn-row">
        <button class="panel-btn primary" id="logBtn" type="button">Log a reading</button>
        <button class="panel-btn ghost" id="dataBtn" type="button">My school's data</button>
      </div>`;
    wireLogBtn(school);
    return;
  }
  const last = readings[readings.length - 1];
  const lastSolar = [...readings].reverse().find(r => r.type === 'solar');
  const lastWind = [...readings].reverse().find(r => r.type === 'wind');
  const solarPct = lastSolar ? pctOf('solar', lastSolar.reading) : null;
  const windPct = lastWind ? pctOf('wind', lastWind.reading) : null;

  const unlocked = d.milestones.unlocked;
  const lastUnlocked = unlocked[unlocked.length - 1];
  const next = d.milestones.next;

  const trendVals = readings.slice(-7).map(r => r.runningTotal);
  const maxTrend = Math.max(...trendVals) || 1;
  const trendBars = trendVals.map((v, i) =>
    `<div class="tb${i === trendVals.length - 1 ? ' newest' : ''}"><span class="tv">${fmt(v)}</span><i style="height:${Math.max(6, Math.round((v / maxTrend) * 44))}px"></i></div>`
  ).join('');

  panelBody.innerHTML = `
    <h2>${esc(school.name)}</h2>
    <div class="panel-region">Latest reading: ${esc(fmtDate(last.date))}</div>
    <div class="reading-grid">
      ${readingCard('Solar', SUN_ICON, solarPct, '#EA168E')}
      ${readingCard('Wind', WIND_ICON, windPct, '#1EAFED')}
    </div>
    <div class="relatable">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#1EAFED" d="M13 2 4 14h6l-1 8 10-13h-6z"/></svg>
      <span>${esc(comparison(t.total))}</span>
    </div>
    <div class="more-box" id="moreBox">
      ${lastUnlocked ? '<span class="unlock-badge">Milestone unlocked</span>' : ''}
      <div class="more-title">${fmt(t.total)} kWh measured so far</div>
      <div class="more-text">${t.count} reading${t.count === 1 ? '' : 's'}: ${fmt(t.solar)} kWh from the sun and ${fmt(t.wind)} kWh from the wind.${lastUnlocked ? ' Latest milestone: ' + esc(lastUnlocked.icon + ' ' + lastUnlocked.milestone) + '.' : ''}</div>
      ${next ? `<div class="next-milestone">⚡ ${fmt(next.kwhToGo)} kWh to ${esc(next.milestone.charAt(0).toLowerCase() + next.milestone.slice(1))}!</div>` : '<div class="next-milestone">⚡ Every milestone unlocked!</div>'}
      <div class="trend-label">Total energy after each reading (kWh)</div>
      <div class="trend">${trendBars}</div>
    </div>
    <div class="panel-btn-row">
      <button class="panel-btn primary" id="logBtn" type="button">Log a reading</button>
        <button class="panel-btn ghost" id="dataBtn" type="button">My school's data</button>
    </div>
  `;
  wireLogBtn(school);
}

// Same conversions as the Google Sheet script and the old site. They only power the live preview.
// The Sheet script works out the saved kWh itself.
function luxTokWh(lux) { return (7.64 * 4.324 * lux) / 1000; }
const WIND_CURVE = [[0,0],[0.459,0.05],[0.917,0.05],[1.376,0.25],[1.835,0.55],[2.294,1],[2.752,1.7],[3.211,2.75],[3.67,3.7],[4.128,4.75],[4.587,5.8],[5.046,6.9],[5.505,7.7],[5.963,8],[6.422,8],[6.881,8],[7.339,7.8],[7.798,7.7],[8.257,7.6],[8.716,7.5],[9.174,7.7],[9.633,7.6],[10.092,7.6],[10.55,7.6],[11.009,7.6],[11.468,7.6],[11.927,7.6],[12.385,7.6],[12.844,7.6],[13.303,7.6],[13.761,7.6],[14.22,0]];
const windSpline = (function (pts) {
  const n = pts.length, x = pts.map(p => p[0]), y = pts.map(p => p[1]);
  const d = [], m = [], a = [], b = [], dist = [], tau = [];
  let i;
  for (i = 0; i < n - 1; i++) { d[i] = (y[i+1]-y[i])/(x[i+1]-x[i]); if (i > 0) m[i] = (d[i-1]+d[i])/2; }
  m[0] = d[0]; m[n-1] = d[n-2];
  for (i = 0; i < n - 1; i++) if (d[i] === 0) { m[i] = 0; m[i+1] = 0; }
  for (i = 0; i < n - 1; i++) { a[i] = m[i]/d[i]; b[i] = m[i+1]/d[i]; dist[i] = a[i]*a[i]+b[i]*b[i]; tau[i] = 3/Math.sqrt(dist[i]); }
  for (i = 0; i < n - 1; i++) if (dist[i] > 9) { m[i] = tau[i]*a[i]*d[i]; m[i+1] = tau[i]*b[i]*d[i]; }
  return function (v) {
    let k; for (k = n - 2; k >= 0; k--) if (x[k] <= v) break;
    const h = x[k+1]-x[k], t = (v-x[k])/h, t2 = t*t, t3 = t2*t;
    return (2*t3-3*t2+1)*y[k] + (t3-2*t2+t)*h*m[k] + (-2*t3+3*t2)*y[k+1] + (t3-t2)*h*m[k+1];

})(WIND_CURVE);
function windTokWh(ms) { return ms > 13.761 ? 0 : (24 * 1000 * windSpline(ms)) / 1000; }
function readingTokWh(type, v) { const k = type === 'solar' ? luxTokWh(v) : windTokWh(v); return Math.round(k * 1000) / 1000; }

const LIMITS = { solar: { min: 0, max: 150000 }, wind: { min: 0, max: 40 } };
const WIND_WARN = 8; // m/s. Above this we gently ask the child to check for a missing decimal point.

  wind:  { label: 'Wind speed',  hint: 'Hold the wind meter up high and wait for the number to settle. It reads from 0 to 12.', unit: 'm/s' }

const ERROR_TEXT = {

  out_of_range: ['That number looks too big.', 'Check the meter again and type the number you see.'],

function pad(n) { return (n < 10 ? '0' : '') + n; }
function todayLocal() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function nowTime() { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function getSavedCode() { try { return localStorage.getItem('emc-school-code') || ''; } catch (e) { return ''; } }

function openForm(school) {
  openToken++; // cancels any school details still loading
  panelBody.innerHTML = formHTML(school);
  panel.hidden = false;
  hint.style.display = 'none';
  $('lf-date').value = todayLocal(); $('lf-date').max = todayLocal(); $('lf-time').value = nowTime();
  $('lf-code').value = getSavedCode();

  const cur = () => ($('t-wind').checked ? 'wind' : 'solar');
  const weather = () => { const id = WEATHER_IDS.find(i => $(i).checked); return id ? $(id).value : ''; };
  const testMode = () => $('lf-test').checked;
  function showMsg(kind, title, body) {
    $('lf-msg').innerHTML = '<div class="lf-msg ' + kind + '"><span>' + esc(title) + '</span>' + (body ? '<p>' + esc(body) + '</p>' : '') + '</div>';
  }
  function parse() {
    const raw = $('lf-reading').value.trim().replace(',', '.');
    if (raw === '') return { empty: true };
    if (!/^\d*\.?\d+$/.test(raw)) return { error: ERROR_TEXT.bad_reading };
    const v = Number(raw), lim = LIMITS[cur()];
    if (v < lim.min || v > lim.max) return { error: ERROR_TEXT.out_of_range };
    return { value: v };
  }
  function update() {
    const t = cur(), txt = TYPE_TEXT[t], p = parse();
    $('lf-label').textContent = txt.label; $('lf-hint').textContent = txt.hint; $('lf-unit').textContent = txt.unit;
    const prev = $('lf-preview'), err = $('lf-error'), warn = $('lf-warn');
    prev.className = 'lf-preview ' + t;
    err.hidden = true; warn.hidden = true;
    if (p.empty || p.error) {
      prev.innerHTML = '<span class="lf-hint">Type a reading to see how much energy that is.</span>';
      if (p.error) { err.textContent = p.error[0] + ' ' + p.error[1]; err.hidden = false; }
      return;
    }
    if (t === 'wind' && p.value > WIND_MAX_MS) {
      warn.textContent = "That's higher than the wind meter reads (12 m/s). Please check the meter. Did you leave out a decimal point?";
      warn.hidden = false;
    } else if (t === 'wind' && p.value > WIND_WARN) {
      warn.textContent = "That's a very strong wind. Please check the meter. Did you leave out a decimal point?";
      warn.hidden = false;
    } else if (t === 'solar' && p.value > SOLAR_MAX_LUX) {
      warn.textContent = "That's higher than the light meter reads (1200 lux). Please check the meter.";
      warn.hidden = false;
    }
    const kwh = readingTokWh(t, p.value);
    const note = t === 'wind' && p.value > 13.761
      ? 'The turbine switches off in winds this strong to keep it safe, so it makes no energy.'
      : comparison(kwh);
    prev.innerHTML = '<span class="lf-hint">If it stayed like this all day, that would make</span>' +
      '<span class="lf-big">' + fmt(kwh) + ' kWh</span><span class="lf-equiv">' + esc(note) + '</span>';
  }
  function checkWhen() {
    const d = $('lf-date').value, t = $('lf-time').value, e = $('lf-when-error');
    e.hidden = true;
    if (!d) { e.textContent = 'Pick the day you took the reading.'; e.hidden = false; return false; }
    if (d > todayLocal()) { e.textContent = ERROR_TEXT.future_date.join(' '); e.hidden = false; return false; }
    if (!t) { e.textContent = 'Pick the time you took the reading.'; e.hidden = false; return false; }
    return true;
  }
  function syncMode() { $('lf-submit').textContent = testMode() ? 'Check my reading' : 'Save my reading'; }

  // After a real save: reload this school, the totals bar and the pin so everything is up to date.
  function refreshAfterSave() {
    delete details[school.id];
    return Promise.all([api({ action: 'schools' }), api({ action: 'school', schoolId: school.id })]).then(([s, d]) => {
      details[school.id] = d;
      s.schools.forEach(n => { const o = schools.find(x => x.id === n.id); if (o) Object.assign(o, n); });
      renderTotalBar();
      const mk = markers[school.id];
      if (mk) { mk.setIcon(pinIcon(true)); mk.getElement().classList.add('active'); }
    });
  }

  function onSubmit(ev) {
    ev.preventDefault();
    $('lf-msg').innerHTML = '';
    const p = parse();
    if (p.empty) { $('lf-error').textContent = 'Type the number from the meter first.'; $('lf-error').hidden = false; $('lf-reading').focus(); return; }
    if (p.error) { $('lf-reading').focus(); return; }
    if (!checkWhen()) return;
    const code = $('lf-code').value.trim();
    if (!code) { showMsg('note', 'Add your school code first.', 'Please ask your teacher if you are not sure what it is.'); $('lf-code').focus(); return; }
    saveCode(code);

    const dry = testMode();
    const before = details[school.id] ? details[school.id].totals.total : school.totals.total;
    const btn = $('lf-submit');
    btn.disabled = true; btn.textContent = dry ? 'Checking…' : 'Saving…';

    apiPost({
      key: code, schoolId: school.id, type: cur(), reading: p.value,
      date: $('lf-date').value, time: $('lf-time').value, weather: weather(), dryRun: dry
    }).then(res => {
      if (!res.ok) {
        const t = ERROR_TEXT[res.error] || ERROR_TEXT.server_error;
        showMsg(res.error === 'duplicate' ? 'note' : 'err', t[0], t[1]);
        return;
      }
      const after = dry ? Math.round((before + res.reading.kwh) * 1000) / 1000 : res.totals.total;
      const newly = MILESTONES.filter(m => m.kwh > before && m.kwh <= after);
      if (dry) {
        showMsg('note', "Looks good! Test mode is on, so this wasn't saved.",
          'Saving it would add ' + fmt(res.reading.kwh) + ' kWh, taking ' + school.name + ' to ' + fmt(after) + ' kWh' +
          (newly.length ? ' and unlocking: ' + newly.map(m => m.milestone).join(', ') + '.' : '.'));
        return;
      }
      showMsg('ok', 'Saved! You added ' + fmt(res.reading.kwh) + ' kWh.',
        newly.length ? 'New milestone unlocked: ' + newly.map(m => m.icon + ' ' + m.milestone).join(', ') + '!' : comparison(res.reading.kwh));
      $('lf-reading').value = ''; update();
      return refreshAfterSave();
    }).catch(() => {
      const t = ERROR_TEXT.network; showMsg('err', t[0], t[1]);
    }).then(() => { btn.disabled = false; syncMode(); });
  }

  $('formBack').addEventListener('click', () => openPanel(school));
  ['t-solar', 't-wind'].forEach(id => $(id).addEventListener('change', update));
  $('lf-reading').addEventListener('input', update);
  $('lf-date').addEventListener('change', checkWhen);
  $('lf-time').addEventListener('change', checkWhen);
  $('lf-test').addEventListener('change', syncMode);
  $('logForm').addEventListener('submit', onSubmit);
  update(); syncMode();
}

/* ------------------------------------------------------------------

------------------------------------------------------------------- */
function pctOf(type, reading) {
  const max = type === 'solar' ? SOLAR_MAX_LUX : WIND_MAX_MS;
  return Math.max(0, Math.min(100, Math.round((reading / max) * 100)));
}
function latestPcts(readings) {
  const s = [...readings].reverse().find(r => r.type === 'solar');
  const w = [...readings].reverse().find(r => r.type === 'wind');
  return { solar: s ? pctOf('solar', s.reading) : null, wind: w ? pctOf('wind', w.reading) : null };
}
function getDetail(school) {
  return details[school.id] ? Promise.resolve(details[school.id])
    : api({ action: 'school', schoolId: school.id }).then(d => (details[school.id] = d));
}
function padTime(t) {
  const m = /^(\d{1,2}):(\d{2})/.exec(t || '');
  return m ? (m[1].length < 2 ? '0' : '') + m[1] + ':' + m[2] : (t || '');
}
function toTs(date, time) {
  const [y, mo, d] = String(date).split('-').map(Number);
  const [h, mi] = padTime(time).split(':').map(Number);
  return new Date(y, (mo || 1) - 1, d || 1, h || 0, mi || 0).getTime();
}
function hexA(hex, a) {
  const n = parseInt(hex.replace('#', ''), 16);
  return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
}
function clearActiveMarkers() {
  Object.values(markers).forEach(m => { const e = m.getElement(); if (e) e.classList.remove('active'); });
}

      s.onload = resolve; s.onerror = () => reject(new Error('plotly'));

  return plotlyPromise;
}

// All three CO2 numbers use the same unit, so they can be compared at a glance.
function co2Unit(maxKg) { return maxKg >= 10000 ? { div: 1000, name: 'tonnes' } : { div: 1, name: 'kg' }; }
function fmtCo2(kg, unit) { return fmt(kg / unit.div) + ' ' + unit.name; }
function co2Html(total, solar, wind) {
  const coal = total * CO2_KG_PER_KWH.coal, gas = total * CO2_KG_PER_KWH.gas;
  const clean = solar * CO2_KG_PER_KWH.sun + wind * CO2_KG_PER_KWH.wind;
  const unit = co2Unit(coal);
  const w = kg => Math.max(3, Math.round((kg / (coal || 1)) * 100));
  const row = (label, kg, cls) => `<div class="co2-bar-row ${cls}"><span class="co2-label">${label}</span><span class="co2-track"><span class="co2-fill" style="width:${w(kg)}%"></span></span><span class="co2-num">${fmtCo2(kg, unit)}</span></div>`;
  return `
    <div class="total-co2">
      <div class="co2-head"><span class="co2-title">CO₂ from making this much energy</span><button class="co2-info" id="co2Info" type="button" aria-label="How we worked this out" title="How we worked this out">?</button></div>
      ${row('Coal', coal, 'dim')}
      ${row('Natural gas', gas, 'dim')}
      ${row('✓ Sun &amp; wind', clean, 'best')}
    </div>`;
}
function openCo2Info() {
  openModal(`
    <h2 id="modalTitle">How we worked out the CO₂</h2>
    <p class="m-text">Every reading is turned into kWh, as if the sun or wind stayed like that for a whole day. We add up all the schools' readings.</p>
    <p class="m-text">Then we ask: how much CO₂ would go into the air to make that much electricity in different ways?</p>
    <ul class="m-list">
      <li><strong>Coal:</strong> about ${CO2_KG_PER_KWH.coal} kg of CO₂ for every kWh</li>
      <li><strong>Natural gas:</strong> about ${CO2_KG_PER_KWH.gas} kg of CO₂ for every kWh</li>
      <li><strong>Sun (rooftop solar panels):</strong> about ${CO2_KG_PER_KWH.sun} kg of CO₂ for every kWh</li>
      <li><strong>Wind (on land):</strong> about ${CO2_KG_PER_KWH.wind} kg of CO₂ for every kWh</li>
    </ul>
    <p class="m-text">These are median whole-life figures for each kind of power station from the IPCC (2014, Working Group III, Annex III). That means coal in a standard power station and gas in a combined-cycle plant. The sun and wind figures come from making and building the panels and turbines.</p>
    <p class="m-text">This is an estimate to show why clean energy matters. It is not a measurement of what any school really saved.</p>`);
}

/* ------------------------------------------------------------------
   "My school's data": unlock, table, graph, download
------------------------------------------------------------------- */
const unlocked = {}; // school id -> true once the school code has been accepted in this visit

// For now the code is checked with a test-mode reading that is never saved.
// TODO: swap for a proper "verify" call once the Sheet script has one.
function verifyCode(school, code) {
  return apiPost({ key: code, schoolId: school.id, type: 'solar', reading: 0, date: todayLocal(), time: nowTime(), weather: '', dryRun: true })
    .then(res => res.ok || !['bad_key', 'unknown_school', 'not_set_up', 'server_error'].includes(res.error));
}

function onDataClick(school) {
  if (unlocked[school.id]) openDataView(school); else openUnlock(school);
}

function openUnlock(school) {
  openModal(`
    <h2 id="modalTitle">Is this your school?</h2>
    <p class="m-text">To see or download ${esc(school.name)}'s data, please type your school code.</p>
    <form id="unlockForm" class="log-form" novalidate>
      <div class="lf-field">
        <label class="lf-label" for="un-code">School code</label>
        <input class="lf-text" id="un-code" type="password" autocomplete="off" placeholder="Ask your teacher">
      </div>
      <button class="panel-btn primary lf-submit" id="un-submit" type="submit">Unlock my school's data</button>
      <div id="un-msg" aria-live="polite"></div>
    </form>`);
  $('un-code').value = getSavedCode();
  const msg = (kind, t, b) => { $('un-msg').innerHTML = '<div class="lf-msg ' + kind + '"><span>' + esc(t) + '</span>' + (b ? '<p>' + esc(b) + '</p>' : '') + '</div>'; };
  $('unlockForm').addEventListener('submit', ev => {
    ev.preventDefault();
    $('un-msg').innerHTML = '';
    const code = $('un-code').value.trim();
    if (!code) { msg('note', 'Please type your school code first.', 'Ask your teacher if you are not sure what it is.'); return; }
    const btn = $('un-submit'); btn.disabled = true; btn.textContent = 'Checking…';
    verifyCode(school, code).then(ok => {
      if (!ok) { const t = ERROR_TEXT.bad_key; msg('err', t[0], t[1]); return; }
      saveCode(code); unlocked[school.id] = true;
      return openDataView(school);
    }).catch(() => { const t = ERROR_TEXT.network; msg('err', t[0], t[1]); })
      .then(() => { btn.disabled = false; btn.textContent = "Unlock my school's data"; });
  });
}

function buildRows(readings) {
  return readings.map(r => ({
    date: r.date, time: padTime(r.time),
    solar: r.type === 'solar' ? r.kwh : null, wind: r.type === 'wind' ? r.kwh : null
  })).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
}
function csvCell(v) {
  let s = v == null ? '' : String(v);
  if (typeof v === 'string' && /^[=+\-@]/.test(s)) s = "'" + s; // stops spreadsheets running a name as a formula
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(school, rows) {
  const lines = [['School', 'Date', 'Time', 'Solar (kWh)', 'Wind (kWh)'].map(csvCell).join(',')];
  rows.forEach(r => lines.push([school.name, r.date, r.time, r.solar, r.wind].map(csvCell).join(',')));
  return lines.join('\r\n');
}
function downloadCSV(school, rows) {
  const blob = new Blob(['﻿' + toCSV(school, rows)], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = school.id + '-energy-data.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function drawSchoolChart(readings) {
  loadPlotly().then(() => {
    const el = $('dv-chart'); if (!el || !readings.length) return;
    const x = readings.map(r => toTs(r.date, r.time));
    const t0 = x[0], t1 = x[x.length - 1], pad = Math.max((t1 - t0) * 0.05, 86400000);
    const last = readings[readings.length - 1];
    const trace = (name, key, color) => ({
      x: x.concat([t1 + pad]), y: readings.map(r => r[key]).concat([last[key]]), name, type: 'scatter', mode: 'lines', stackgroup: 'one',
      line: { color, width: 2, shape: 'hv' }, fillcolor: hexA(color, 0.35), hovertemplate: name + ': %{y:.1f} kWh<extra></extra>'
    });
    Plotly.react(el, [trace('Sun', 'runningSolar', '#EA168E'), trace('Wind', 'runningWind', '#1EAFED')], plotLayout(), { displayModeBar: false, responsive: true });
  }).catch(() => chartFallback('dv-chart'));
}

function openDataView(school) {
  openModal(`<h2 id="modalTitle">${esc(school.name)}</h2><p class="m-text">Loading your data…</p>`);
  return getDetail(school).then(d => {
    const rows = buildRows(d.readings), t = d.totals;
    if (!rows.length) {
      modalBody.innerHTML = `<h2 id="modalTitle">${esc(school.name)}</h2><p class="m-text">No readings yet. Once your school adds a reading, you can see and download it here.</p>`;
      return;
    }
    const fmtCell = v => (v == null ? '' : fmt(v, 3));
    modalBody.innerHTML = `
      <h2 id="modalTitle">${esc(school.name)}: my data</h2>
      <p class="m-text">${t.count} readings and ${fmt(t.total)} kWh in total: ${fmt(t.solar)} kWh from the sun and ${fmt(t.wind)} kWh from the wind.</p>
      <div class="m-actions"><button class="panel-btn primary" id="dv-download" type="button">Download my data (CSV)</button></div>
      <div id="dv-chart" class="data-chart" role="img" aria-label="Energy measured over time, split into sun and wind"></div>
      <div class="data-table-wrap"><table class="data">
        <thead><tr><th>School</th><th>Date</th><th>Time</th><th class="n">Solar (kWh)</th><th class="n">Wind (kWh)</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td>${esc(school.name)}</td><td>${esc(r.date)}</td><td>${esc(r.time)}</td><td class="n">${fmtCell(r.solar)}</td><td class="n">${fmtCell(r.wind)}</td></tr>`).join('')}</tbody>
      </table></div>`;
    $('dv-download').addEventListener('click', () => downloadCSV(school, rows));
    drawSchoolChart(d.readings);
  }).catch(() => {
    modalBody.innerHTML = `<h2 id="modalTitle">${esc(school.name)}</h2><p class="m-text">We couldn't load your data. Please try again in a minute.</p>`;
  });
}

/* ------------------------------------------------------------------
   Compare two schools
------------------------------------------------------------------- */
const compare = { active: false, picks: [] };
const CMP_COLORS = ['#BD2D87', '#44CFCB'];
const compareBar = $('compareBar');
const compareBtn = $('compareBtn');

function updateCompareBar() {
  compareBar.hidden = false;
  const n = compare.picks.length;
  $('compareMsg').textContent = n === 0 ? 'Click the first school you want to compare.'
    : 'Now click a second school to compare with ' + compare.picks[0].name + '.';
}
function startCompare() {
  compare.active = true; compare.picks = [];
  panel.hidden = true; hint.style.display = 'none';
  clearActiveMarkers();
  compareBtn.classList.add('on');
  updateCompareBar();
}
function cancelCompare() {
  compare.active = false; compare.picks = [];
  clearActiveMarkers();
  compareBar.hidden = true; compareBtn.classList.remove('on');
  if (panel.hidden) hint.style.display = '';
}
function comparePick(school) {
  if (compare.picks.some(s => s.id === school.id)) return;
  compare.picks.push(school);
  const e = markers[school.id].getElement(); if (e) e.classList.add('active');
  if (compare.picks.length < 2) { updateCompareBar(); return; }
  const [a, b] = compare.picks;
  compare.active = false; compare.picks = [];
  compareBar.hidden = true; compareBtn.classList.remove('on');
  openCompare(a, b);
}
compareBtn.addEventListener('click', () => { if (compare.active) cancelCompare(); else startCompare(); });
$('compareCancel').addEventListener('click', cancelCompare);

function schoolStats(school, d) {
  const r = d.readings, t = d.totals, un = d.milestones.unlocked;
  return {
    name: school.name, total: t.total, solar: t.solar, wind: t.wind, count: t.count,
    avg: t.count ? t.total / t.count : null,
    first: r.length ? r[0].date : null, last: r.length ? r[r.length - 1].date : null,
    pcts: latestPcts(r), unlockedCount: un.length, lastUnlocked: un[un.length - 1] || null, next: d.milestones.next,
    readings: r
  };
}

function drawCompareChart(stats) {
  loadPlotly().then(() => {
    const el = $('cmp-chart'); if (!el) return;
    const traces = stats.filter(s => s.readings.length).map((s, i) => {
      const x = s.readings.map(r => toTs(r.date, r.time));
      const t1 = x[x.length - 1], pad = 86400000 * 3;
      return { x: x.concat([t1 + pad]), y: s.readings.map(r => r.runningTotal).concat([s.readings[s.readings.length - 1].runningTotal]),
        name: s.name, type: 'scatter', mode: 'lines', line: { color: CMP_COLORS[stats.indexOf(s)], width: 3, shape: 'hv' },
        hovertemplate: '%{y:.1f} kWh<extra>' + s.name + '</extra>' };
    });
    if (!traces.length) { el.innerHTML = '<p class="m-text">Neither school has readings to chart yet.</p>'; el.style.height = 'auto'; return; }
    Plotly.react(el, traces, plotLayout(), { displayModeBar: false, responsive: true });
  }).catch(() => chartFallback('cmp-chart'));
}

function renderCompare(stats) {
  const row = (k, a, b) => `<tr><td class="k">${k}</td><td>${a}</td><td>${b}</td></tr>`;
  const both = (k, f) => row(k, f(stats[0], 0), f(stats[1], 1));
  const bat = (pct, color) => pct == null ? 'No reading yet' : `<span class="cmp-battery">${batteryIcon(pct, color)}${pct}%</span>`;
  const kwh = v => (v == null ? '–' : fmt(v) + ' kWh');
  const batteries = s => (s.pcts.solar == null && s.pcts.wind == null) ? 'No readings yet'
    : '<div class="cmp-bat-line"><span>Sun</span>' + bat(s.pcts.solar, '#EA168E') + '</div><div class="cmp-bat-line"><span>Wind</span>' + bat(s.pcts.wind, '#1EAFED') + '</div>';
  modalBody.innerHTML = `
    <h2 id="modalTitle">Compare schools</h2>
    <p class="m-text">Schools started at different times and take different numbers of readings, so the totals are not always a fair race.</p>
    <div class="data-table-wrap"><table class="cmp">
      <thead><tr><th></th>${stats.map((s, i) => `<th><span class="dot" style="background:${CMP_COLORS[i]}"></span>${esc(s.name)}</th>`).join('')}</tr></thead>
      <tbody>
        ${both('Total energy', s => '<strong>' + kwh(s.total) + '</strong><br><span class="m-sub">Sun ' + kwh(s.solar) + ' · Wind ' + kwh(s.wind) + '</span>')}
        ${both('Batteries (latest reading)', batteries)}
        ${both('Milestones unlocked', s => s.unlockedCount + ' of ' + MILESTONES.length)}
        ${both('Next milestone', s => s.next ? esc(s.next.icon + ' ' + s.next.milestone) + '<br><span class="m-sub">' + fmt(s.next.kwhToGo) + ' kWh to go</span>' : 'All unlocked!')}
        ${both('Readings', s => String(s.count))}
      </tbody></table></div>
    <h3>Energy over time</h3>
    <div id="cmp-chart" class="data-chart" role="img" aria-label="Total energy measured over time for both schools"></div>
    <div class="m-actions"><button class="panel-btn ghost" id="cmp-again" type="button">Compare different schools</button></div>`;
  $('cmp-again').addEventListener('click', () => { closeModal(); startCompare(); });
  drawCompareChart(stats);
}

function openCompare(a, b) {
  modalOnClose = clearActiveMarkers;
  openModal('<h2 id="modalTitle">Compare schools</h2><p class="m-text">Loading both schools…</p>');
  Promise.all([getDetail(a), getDetail(b)])
    .then(([da, db]) => renderCompare([schoolStats(a, da), schoolStats(b, db)]))
    .catch(() => { modalBody.innerHTML = '<h2 id="modalTitle">Compare schools</h2><p class="m-text">We couldn\'t load these schools. Please try again in a minute.</p>'; });
}

/* ------------------------------------------------------------------
   Start: load the schools from the Sheet, then draw everything
------------------------------------------------------------------- */
map.setView([53.5, -2.5], 6);
totalBar.innerHTML = '<div class="total-stat-text"><span class="total-sub">Loading schools…</span></div>';

api({ action: 'schools' })
  .then(d => {
    // "Show on map" in the Schools tab decides which schools appear (e.g. private homes stay hidden).
    schools = d.schools.filter(s => s.showOnMap);
    const probe = schools.find(s => s.readings > 0);
    // Any school's detail includes the full milestone list, so load one to get it.
    return (probe ? api({ action: 'school', schoolId: probe.id }).then(det => {
      details[probe.id] = det;
      MILESTONES = det.milestones.unlocked.concat(det.milestones.upcoming).sort((a, b) => a.kwh - b.kwh);
    }) : Promise.resolve());
  })
  .then(() => { renderTotalBar(); addMarkers(); })
  .catch(() => {
    totalBar.innerHTML = '<div class="total-stat-text"><span class="total-sub">We couldn\'t load the schools just now. Please refresh the page.</span></div>';
  });

</script>
