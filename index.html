<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Energy Mapping Challenge</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Slab:wght@600;700&display=swap" rel="stylesheet">

  <style>
    html, body { margin: 0; height: 100%; font-family: 'Roboto', sans-serif; }
    body { display: flex; flex-direction: column; }
    #map { flex: 1; min-height: 0; width: 100%; }
    .panel {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: 360px;
  max-width: 90vw;
  background: #FFFFFF;
  border-radius: 0;
  border-left: 1px solid rgba(51,55,69,0.14);
  box-shadow: -4px 0 20px rgba(0,0,0,.12);
  padding: 20px;
  z-index: 1000;
  overflow-y: auto;
  font-family: 'Roboto', sans-serif;
}
.panel[hidden] { display: none; }
.panel-close {
  position: absolute; top: 12px; right: 16px;
  border: none; background: #EAF4EE; width: 30px; height: 30px;
  border-radius: 50%; font-size: 18px; cursor: pointer;
}
.panel h2 { font-family: 'Roboto Slab', serif; margin: 0 24px 14px 0; }
.bar-row { margin-bottom: 14px; }
.bar-label { font-size: 12px; font-weight: 600; color: #5B6372; margin-bottom: 4px; }
.bar-track { background: #EAF4EE; border-radius: 999px; height: 10px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; }
.panel-btn-row { display: flex; gap: 10px; margin-top: 16px; }
.panel-btn {
  flex: 1; padding: 10px; border-radius: 999px; border: none; font-weight: 700;
  font-family: 'Roboto', sans-serif; cursor: pointer;
}
.panel-btn.primary { background: #1EAFED; color: white; }
.panel-btn.ghost { background: #EAF4EE; color: #333745; }

.panel-region { font-size: 12px; color: #5B6372; margin: -8px 0 14px; }
.relatable {
  background: #FBD9EA; color: #333745; border-radius: 14px;
  padding: 12px 14px; font-size: 14px; font-weight: 700;
  display: flex; gap: 10px; align-items: center; margin-bottom: 14px;
}
.relatable svg { flex: 0 0 auto; }
.more-box { background: #EAF4EE; border-radius: 14px; padding: 14px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px; }
.unlock-badge { background: #1EAFED; color: white; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding: 4px 10px; border-radius: 999px; align-self: flex-start; }
.more-title { font-weight: 800; font-size: 15px; color: #333745; font-family: 'Roboto Slab', serif; }
.more-text { font-size: 13px; color: #5B6372; }
.trend-label { font-size: 11px; font-weight: 700; color: #5B6372; text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
.trend { display: flex; align-items: flex-end; gap: 4px; height: 40px; }
.trend i { flex: 1; background: #D3EFFB; border-radius: 3px 3px 0 0; }

.battery-row { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.battery-label { width:50px; font-size:13px; font-weight:700; color:#333745; }
.battery-pct { font-size:14px; font-weight:800; color:#333745; }
.pin-circle {
  width: 32px; height: 32px; border-radius: 50%;
  background: #EA168E; border: 3px solid white;
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
  display: flex; align-items: center; justify-content: center;
  transition: background .15s ease;
}
.school-pin:hover .pin-circle,
.school-pin.active .pin-circle { background: #1EAFED; }
.reading-grid { display: flex; gap: 12px; margin-bottom: 14px; }
.reading-card {
  flex: 1; background: #EAF4EE; border-radius: 14px; padding: 14px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.reading-label { font-size: 12px; font-weight: 700; color: #5B6372; text-transform: uppercase; letter-spacing: .04em; }
.reading-pct { font-size: 18px; font-weight: 800; color: #333745; }
#hint {
  position: fixed; top: 78px; left: 50%; transform: translateX(-50%);
  background: #FFFFFF; border: 1px solid rgba(51,55,69,0.14);
  box-shadow: 0 4px 14px rgba(0,0,0,.12); padding: 8px 16px;
  border-radius: 999px; font-weight: 700; font-size: 13px;
  color: #333745; z-index: 500; pointer-events: none;
}
header {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px;
  background: #FFFFFF;
  border-bottom: 1px solid rgba(51,55,69,0.14);
}
.brand h1 { font-family: 'Roboto Slab', serif; font-size: 20px; margin: 0; color: #333745; }
.brand-sub { font-size: 12px; color: #5B6372; display: flex; align-items: center; gap: 6px; }
.brand-logo { height: 16px; width: auto; vertical-align: middle; }
.compare-btn {
  background: #EAF4EE; color: #333745; border: none; border-radius: 999px;
  padding: 10px 18px; font-weight: 700; font-family: 'Roboto', sans-serif;
  font-size: 14px; cursor: pointer;
}
  </style>
</head>

  <script>
const map = L.map('map');

L.tileLayer('https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png?key=cb1_4f1n_1_78afe8bcf5a4043ff6ac084b', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  maxZoom: 19
}).addTo(map);

const schools = [
  { name: 'Maple Grove Primary', lat: 52.21, lng: 0.13, date: '6 Oct', solarPct: 72, windPct: 38, phones: 14, kettles: 6, cumulative: 182, trend: [30, 45, 40, 60, 55, 70, 72] },
  { name: 'Riverside Primary School', lat: 51.39, lng: -2.36, date: '6 Oct', solarPct: 55, windPct: 60, phones: 9, kettles: 4, cumulative: 140, trend: [20, 35, 30, 45, 50, 52, 55] },
  { name: 'Northfell Primary', lat: 54.68, lng: -3.52, date: '5 Oct', solarPct: 34, windPct: 81, phones: 11, kettles: 5, cumulative: 168, trend: [60, 70, 65, 75, 78, 80, 81] }
];

const schoolIcon = L.divIcon({
  className: 'school-pin',
  html: `
    <div class="pin-circle">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M13 2 4 14h6l-1 8 10-13h-6z"/></svg>
    </div>
  `,
  iconSize: [32, 32],
  iconAnchor: [16, 16]
});
const panel = document.getElementById('panel');
const panelBody = document.getElementById('panelBody');
const hint = document.getElementById('hint');
document.getElementById('panelClose').addEventListener('click', () => { panel.hidden = true; hint.style.display = ''; });

function batteryIcon(pct, color) {
  const fillWidth = Math.max(4, (pct / 100) * 88);
  return `
    <svg width="120" height="48" viewBox="0 0 120 48" aria-hidden="true">
      <rect x="2" y="2" width="104" height="44" rx="10" fill="none" stroke="#333745" stroke-width="4"/>
      <rect x="108" y="16" width="10" height="16" rx="3" fill="#333745"/>
      <rect x="10" y="10" width="${fillWidth}" height="28" rx="6" fill="${color}"/>
    </svg>
  `;
}
function openPanel(school, expand) {
  const maxTrend = Math.max(...school.trend);
  const trendBars = school.trend.map((v, i) =>
    `<i style="height:${Math.max(10, (v / maxTrend) * 100)}%${i === school.trend.length - 1 ? ';background:#1EAFED' : ''}"></i>`
  ).join('');
  panelBody.innerHTML = `
    <h2>${school.name}</h2>
    <div class="panel-region">Readings from ${school.date}</div>
    <div class="reading-grid">
  <div class="reading-card">
    <div class="reading-label">Solar</div>
    <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="5" fill="#EA168E"/>
      <g stroke="#EA168E" stroke-width="2" stroke-linecap="round">
        <line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/>
        <line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/>
        <line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/>
        <line x1="4.2" y1="19.8" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.8" y2="4.2"/>
      </g>
    </svg>
    ${batteryIcon(school.solarPct, '#EA168E')}
    <div class="reading-pct">${school.solarPct}%</div>
  </div>
  <div class="reading-card">
    <div class="reading-label">Wind</div>
    <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
      <g fill="none" stroke="#1EAFED" stroke-width="2.2" stroke-linecap="round">
        <path d="M3 8 H13 a2.6 2.6 0 1 0 -2.6 -2.6"/>
        <path d="M2 13 H16 a2.6 2.6 0 1 1 -2.6 2.6"/>
        <path d="M5 18 H11 a2.1 2.1 0 1 0 -2.1 -2.1"/>
      </g>
    </svg>
    ${batteryIcon(school.windPct, '#1EAFED')}
    <div class="reading-pct">${school.windPct}%</div>
  </div>
</div>
    <div class="relatable">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#1EAFED" d="M13 2 4 14h6l-1 8 10-13h-6z"/></svg>

    </div>
    <div class="more-box" id="moreBox" ${expand ? '' : 'hidden'}>
      <span class="unlock-badge">Milestone unlocked</span>
      <div class="more-title">${school.cumulative} kWh so far this term</div>
      <div class="more-text">That's enough to power the whole school for ${Math.round(school.cumulative / 40)} days.</div>
      <div class="trend-label">Last 7 days</div>
      <div class="trend">${trendBars}</div>
    </div>
    <div class="panel-btn-row">
      <button class="panel-btn ghost" id="moreBtn" type="button">More</button>
      <button class="panel-btn primary" id="logBtn" type="button">Log a reading</button>
    </div>
  `;
  panel.hidden = false;
  hint.style.display = 'none';
  document.getElementById('moreBtn').addEventListener('click', () => {
    openPanel(school, !expand);
  });
}
const markers = {};

schools.forEach(school => {
  const marker = L.marker([school.lat, school.lng], { icon: schoolIcon })
    .addTo(map)
    .bindTooltip(school.name, { direction: 'top', offset: [0, -14] })
    .on('click', () => {
      Object.values(markers).forEach(m => m.getElement().classList.remove('active'));
      marker.getElement().classList.add('active');
      openPanel(school);
    });
  markers[school.name] = marker;
});

const bounds = L.latLngBounds(schools.map(s => [s.lat, s.lng]));
map.fitBounds(bounds, { padding: [40, 40] });

</script>
</body>
</html>
